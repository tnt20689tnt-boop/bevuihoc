name: Verify BÉ HỌC VUI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production app
        run: bun run build
      # The repository currently has legacy formatting violations across many files.
      # Keep lint visible but non-blocking so the automated test suite still runs.
      - name: Run lint (non-blocking while legacy formatting is cleaned up)
        run: bun run lint
        continue-on-error: true
      - name: Run tests
        run: bun run test
