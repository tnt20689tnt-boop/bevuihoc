<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Barbee Fashion Influencer 💖</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { background: linear-gradient(90deg, #ff6b9d, #c44569); color: white; padding: 15px 20px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    .back-btn { background: rgba(255,255,255,0.2); color: white; border: 2px solid white; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; text-decoration: none; transition: 0.2s; font-size: 14px; }
    .back-btn:hover { background: white; color: #c44569; }
    .game-wrapper { flex: 1; position: relative; background-color: #000; width: 100%; height: 100%; }
    iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    /* Màn hình chờ */
    .loading-overlay { position: absolute; inset: 0; background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ff6b9d; z-index: 20; transition: opacity 0.5s ease; }
    .spinner { width: 60px; height: 60px; border: 5px solid rgba(255,107,157,0.3); border-top-color: #ff6b9d; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 18px; letter-spacing: 2px; font-weight: bold; }
</style>
</head>
<body>
    <div class="header">
        <div>💖 Barbee Fashion Influencer 💖</div>
        <a href="#" class="back-btn" onclick="reloadGame()">🔄 Tải lại</a>
    </div>
    <div class="game-wrapper" id="game-wrapper">
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">ĐANG TẢI GAME...</div>
        </div>
        <!-- Nhúng iframe trực tiếp từ Plix.gg -->
        <iframe id="game-iframe" src="https://plix.gg/vi/games/barbee-fashion-influencer" allow="fullscreen" allowfullscreen scrolling="no"></iframe>
    </div>
    <script>
        const iframe = document.getElementById('game-iframe');
        const loading = document.getElementById('loading');
        // Khi game tải xong, ẩn màn hình chờ
        iframe.onload = function() {
            loading.style.opacity = '0';
            setTimeout(() => { loading.style.display = 'none'; }, 500);
        };
        // Hàm tải lại game nếu bị lỗi
        function reloadGame() {
            loading.style.display = 'flex';
            loading.style.opacity = '1';
            iframe.src = iframe.src; // Gán lại src để reload
        }
    </script>
</body>
</html>
