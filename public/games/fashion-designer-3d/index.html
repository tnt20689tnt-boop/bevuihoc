<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess World 3D - Beauty & Fashion</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        /* UI Overlay */
        #ui-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; padding: 20px; pointer-events: auto; }
        .brand { color: white; font-size: 24px; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.5); background: rgba(255,107,157,0.8); padding: 10px 20px; border-radius: 30px; backdrop-filter: blur(5px); }
        /* Bottom Panel */
        .bottom-panel { background: rgba(20, 10, 30, 0.85); backdrop-filter: blur(10px); padding: 20px; display: flex; justify-content: center; gap: 20px; pointer-events: auto; border-top: 2px solid #ff6b9d; }
        .tool-group { display: flex; gap: 10px; }
        .tool-btn { background: linear-gradient(45deg, #ff6b9d, #c44569); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tool-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,107,157,0.8); }
        /* Color Picker */
        .color-options { display: flex; gap: 5px; align-items: center; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid white; transition: 0.2s; }
        .color-dot:hover { transform: scale(1.2); }
        /* Loading Screen */
        #loading { position: absolute; inset: 0; background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ff6b9d; z-index: 100; transition: opacity 0.5s; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,107,157,0.3); border-top-color: #ff6b9d; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2>Đang tải thế giới 3D...</h2>
        <p>Vui lòng chờ trong giây lát</p>
    </div>
    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <div class="top-bar">
            <div class="brand">Princess World 3D 👑</div>
        </div>
        <div class="bottom-panel">
            <div class="tool-group">
                <button class="tool-btn" onclick="game.toggleAnimation('Idle')">Đứng</button>
                <button class="tool-btn" onclick="game.toggleAnimation('Walk')">Đi bộ</button>
                <button class="tool-btn" onclick="game.toggleAnimation('Pose')">Tạo dáng</button>
            </div>
            <div class="color-options">
                <span style="color:white; margin-right:10px; font-weight:bold;">Màu váy:</span>
                <div class="color-dot" style="background:#e91e63;" onclick="game.changeDressColor('#e91e63')"></div>
                <div class="color-dot" style="background:#4facfe;" onclick="game.changeDressColor('#4facfe')"></div>
                <div class="color-dot" style="background:#f8b500;" onclick="game.changeDressColor('#f8b500')"></div>
                <div class="color-dot" style="background:#a18cd1;" onclick="game.changeDressColor('#a18cd1')"></div>
                <div class="color-dot" style="background:#ffffff;" onclick="game.changeDressColor('#ffffff')"></div>
            </div>
        </div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        class PrincessWorld {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x1a1a2e);
                this.scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(0, 2, 5);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);
                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.target.set(0, 1.2, 0);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.maxPolarAngle = Math.PI / 2;
                this.controls.minDistance = 2;
                this.controls.maxDistance = 10;
                this.setupLights();
                this.createStage();
                this.loadCharacter();
                window.addEventListener('resize', () => this.onWindowResize());
                this.clock = new THREE.Clock();
                this.animate();
            }
            setupLights() {
                const ambient = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(ambient);
                const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
                mainLight.position.set(5, 10, 5);
                mainLight.castShadow = true;
                mainLight.shadow.mapSize.width = 2048;
                mainLight.shadow.mapSize.height = 2048;
                mainLight.shadow.bias = -0.0001;
                this.scene.add(mainLight);
                const fillLight = new THREE.DirectionalLight(0xffd1dc, 0.5);
                fillLight.position.set(-5, 5, 0);
                this.scene.add(fillLight);
                const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
                rimLight.position.set(0, 5, -5);
                this.scene.add(rimLight);
            }
            createStage() {
                const floorGeo = new THREE.PlaneGeometry(20, 20);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0xf5e6f0, roughness: 0.1, metalness: 0.8, envMapIntensity: 1 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                this.scene.add(floor);
                const carpetGeo = new THREE.CircleGeometry(2.5, 32);
                const carpetMat = new THREE.MeshStandardMaterial({ color: 0xff6b9d, roughness: 0.9 });
                const carpet = new THREE.Mesh(carpetGeo, carpetMat);
                carpet.rotation.x = -Math.PI / 2;
                carpet.position.y = 0.01;
                carpet.receiveShadow = true;
                this.scene.add(carpet);
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2;
                    const pillarGeo = new THREE.CylinderGeometry(0.2, 0.2, 4, 16);
                    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.5, roughness: 0.2 });
                    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                    pillar.position.set(Math.cos(angle) * 4, 2, Math.sin(angle) * 4);
                    pillar.castShadow = true;
                    this.scene.add(pillar);
                }
            }
            loadCharacter() {
                const loader = new GLTFLoader();
                const modelUrl = 'https://threejs.org/examples/models/gltf/Xbot.glb';
                loader.load(modelUrl, (gltf) => {
                    this.character = gltf.scene;
                    this.character.scale.set(1, 1, 1);
                    this.character.position.set(0, 0, 0);
                    this.character.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.name.includes('Dress') || child.name.includes('Body')) {
                                child.material = new THREE.MeshStandardMaterial({ color: 0xff6b9d, roughness: 0.4, metalness: 0.1 });
                            }
                        }
                    });
                    this.scene.add(this.character);
                    this.mixer = new THREE.AnimationMixer(this.character);
                    this.actions = {};
                    gltf.animations.forEach((clip) => {
                        this.actions[clip.name] = this.mixer.clipAction(clip);
                    });
                    if (this.actions['Idle']) this.actions['Idle'].play();
                    document.getElementById('loading').style.opacity = '0';
                    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 500);
                }, undefined, (error) => {
                    console.error('Lỗi tải mô hình:', error);
                    document.getElementById('loading').innerHTML = '<h2 style="color:red">Lỗi tải mô hình 3D</h2><p>Vui lòng kiểm tra kết nối mạng hoặc thử lại sau.</p>';
                });
            }
            toggleAnimation(name) {
                if (!this.actions) return;
                Object.values(this.actions).forEach(action => action.stop());
                if (this.actions[name]) this.actions[name].reset().play();
                else if (name === 'Pose' && this.actions['Idle']) this.actions['Idle'].play();
            }
            changeDressColor(colorHex) {
                if (!this.character) return;
                this.character.traverse((child) => {
                    if (child.isMesh && (child.name.includes('Dress') || child.name.includes('Body'))) child.material.color.set(colorHex);
                });
            }
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
            animate() {
                requestAnimationFrame(() => this.animate());
                const delta = this.clock.getDelta();
                if (this.mixer) this.mixer.update(delta);
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }
        window.game = new PrincessWorld();
    </script>
</body>
</html>
