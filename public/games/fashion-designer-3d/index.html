<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Công Chúa Beauty & Fashion Studio 3D - Bé Vui Học</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js + Controls + Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #f472b6;
      border-radius: 8px;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 3px solid rgba(251, 207, 232, 0.9);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-indigo-100">

  <!-- 3D Canvas Viewport -->
  <div id="canvas-container"></div>

  <!-- Loading Screen -->
  <div id="loading-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-pink-100/90 backdrop-blur-md transition-opacity duration-500">
    <div class="w-16 h-16 border-4 border-pink-400 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-pink-600 font-bold text-lg animate-pulse">Đang chuẩn bị Cung Điện Công Chúa 3D...</p>
    <span class="text-xs text-pink-400 mt-2">Đang tải mô hình chất lượng cao...</span>
  </div>

  <!-- UI Overlay -->
  <div class="relative z-10 w-full h-full pointer-events-none flex flex-col justify-between p-3 sm:p-5">
    
    <!-- Top Bar Navigation -->
    <header class="flex justify-between items-center pointer-events-auto">
      <button onclick="alert('Đã sẵn sàng kết nối quay lại trang chính Bé Vui Học!')"
              class="flex items-center gap-2 px-4 py-2.5 bg-white/90 hover:bg-white text-pink-600 rounded-full font-bold shadow-lg transition active:scale-95 border-2 border-pink-200 text-sm sm:text-base">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span>Bé Vui Học</span>
      </button>

      <!-- Camera Mode Selector -->
      <div class="flex gap-1 sm:gap-2 bg-white/90 backdrop-blur-md p-1.5 rounded-full shadow-lg border-2 border-pink-200">
        <button onclick="setCameraView('FACE')" id="btn-cam-face" class="px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition bg-pink-500 text-white shadow">
          Gương Mặt 💄
        </button>
        <button onclick="setCameraView('UPPER')" id="btn-cam-upper" class="px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition text-gray-600 hover:text-pink-500">
          Nửa Thân 👑
        </button>
        <button onclick="setCameraView('BODY')" id="btn-cam-body" class="px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition text-gray-600 hover:text-pink-500">
          Toàn Thân 👗
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2">
        <label class="cursor-pointer flex items-center gap-1.5 px-3 py-2 bg-purple-500 hover:bg-purple-600 text-white rounded-full font-bold shadow-lg transition active:scale-95 text-xs sm:text-sm" title="Nạp file .glb tùy chọn từ máy tính">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Nạp GLB riêng</span>
          <input type="file" id="glb-file-input" accept=".glb,.gltf" class="hidden" onchange="handleFileUpload(event)">
        </label>
        <button onclick="takeSnapshot()" class="flex items-center gap-1.5 px-3.5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full font-bold shadow-lg transition active:scale-95 text-sm sm:text-base">
          <i data-lucide="camera" class="w-5 h-5"></i>
          <span class="hidden sm:inline">Chụp Ảnh</span>
        </button>
        <button onclick="resetDefaults()" class="p-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-full shadow-lg transition active:scale-95" title="Làm mới">
          <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- Floating Customizer Panel (Left/Bottom responsive) -->
    <main class="pointer-events-auto flex items-end sm:items-center">
      <div class="glass-panel w-full sm:w-96 max-h-[75vh] rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col transition-all">
        
        <!-- Category Tabs -->
        <div class="flex gap-2 border-b-2 border-pink-100 pb-3 mb-3 overflow-x-auto">
          <button onclick="switchTab('makeup')" id="tab-makeup" class="px-4 py-2 rounded-2xl font-bold text-sm bg-pink-500 text-white shadow-md transition flex items-center gap-1.5 whitespace-nowrap">
            <span>💄 Trang Điểm</span>
          </button>
          <button onclick="switchTab('hair')" id="tab-hair" class="px-4 py-2 rounded-2xl font-bold text-sm bg-pink-50 text-pink-700 hover:bg-pink-100 transition flex items-center gap-1.5 whitespace-nowrap">
            <span>💇 Tóc & Phụ Kiện</span>
          </button>
          <button onclick="switchTab('outfit')" id="tab-outfit" class="px-4 py-2 rounded-2xl font-bold text-sm bg-pink-50 text-pink-700 hover:bg-pink-100 transition flex items-center gap-1.5 whitespace-nowrap">
            <span>👗 Váy Dạ Hội</span>
          </button>
        </div>

        <!-- Panel Contents (Scrollable) -->
        <div id="panel-content" class="overflow-y-auto custom-scrollbar pr-1 max-h-[50vh] space-y-4 text-gray-800">
          <!-- Injected via JavaScript -->
        </div>

      </div>
    </main>

    <!-- Bottom Hint -->
    <footer class="text-center text-xs text-pink-900/80 font-medium pb-1 drop-shadow pointer-events-none">
      ✨ Chạm vuốt để xoay công chúa 360° • Cuộn chuột để phóng to/thu nhỏ • Có thể kéo thả file .glb vào màn hình!
    </footer>
  </div>

  <!-- Main JavaScript Logic -->
  <script>
    /* =========================================================
       1. STATE MANAGEMENT & AUTO-SAVE (LocalStorage)
       ========================================================= */
    const STORAGE_KEY = 'be_vui_hoc_princess_v3';
    
    const defaultState = {
      cameraMode: 'BODY',
      activeTab: 'outfit',
      makeup: {
        skinTone: '#ffdfd3',
        lipColor: '#e63946',
        eyeColor: '#2563eb'
      },
      outfit: {
        hairColor: '#d4a373', // Vàng mật ong
        dressColor: '#ec4899', // Hồng công chúa
        skirtColor: '#f472b6',
        accessoryColor: '#ffd700'
      }
    };

    let appState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }

    function resetDefaults() {
      if (confirm('Bé có muốn làm mới lại màu sắc trang phục ban đầu không?')) {
        appState = JSON.parse(JSON.stringify(defaultState));
        saveState();
        applyAllMaterialColors();
        renderActiveTab();
      }
    }

    /* =========================================================
       2. THREE.JS 3D SCENE SETUP (PBR & ANTI-GLARE)
       ========================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#fbe8f2');
    scene.fog = new THREE.FogExp2('#fbe8f2', 0.05);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 50);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // Khử cháy sáng, tạo màu mềm mại chuẩn điện ảnh
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 0.5;
    controls.maxDistance = 4.5;

    // Smart Camera Views
    const CAMERA_VIEWS = {
      FACE: { pos: new THREE.Vector3(0, 1.45, 0.8), target: new THREE.Vector3(0, 1.40, 0) },
      UPPER: { pos: new THREE.Vector3(0, 1.25, 1.4), target: new THREE.Vector3(0, 1.15, 0) },
      BODY: { pos: new THREE.Vector3(0, 0.9, 2.5), target: new THREE.Vector3(0, 0.8, 0) }
    };

    let targetCameraPos = CAMERA_VIEWS[appState.cameraMode].pos.clone();
    let targetCameraLook = CAMERA_VIEWS[appState.cameraMode].target.clone();
    camera.position.copy(targetCameraPos);
    controls.target.copy(targetCameraLook);

    function setCameraView(mode) {
      appState.cameraMode = mode;
      saveState();
      targetCameraPos.copy(CAMERA_VIEWS[mode].pos);
      targetCameraLook.copy(CAMERA_VIEWS[mode].target);

      ['FACE', 'UPPER', 'BODY'].forEach(m => {
        const btn = document.getElementById(`btn-cam-${m.toLowerCase()}`);
        if (!btn) return;
        if (m === mode) {
          btn.className = "px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition bg-pink-500 text-white shadow";
        } else {
          btn.className = "px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition text-gray-600 hover:text-pink-500";
        }
      });
    }

    /* =========================================================
       3. ROYAL ENVIRONMENT & LIGHTING & SPARKLES
       ========================================================= */
    const ambientLight = new THREE.AmbientLight(0xfff0f6, 0.9);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(2, 3.5, 2.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffe4e6, 0.6);
    fillLight.position.set(-2, 2, 2);
    scene.add(fillLight);

    const rimLight = new THREE.SpotLight(0xf472b6, 1.5);
    rimLight.position.set(0, 3, -2.5);
    rimLight.lookAt(0, 1.0, 0);
    scene.add(rimLight);

    // Sàn đá cẩm thạch
    const floorGeo = new THREE.CircleGeometry(4.0, 64);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.2,
      metalness: 0.1
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Bục đứng cung điện tròn viền vàng
    const podiumGeo = new THREE.CylinderGeometry(0.9, 1.0, 0.08, 48);
    const podiumMat = new THREE.MeshStandardMaterial({ color: 0xffe4f0, roughness: 0.3, metalness: 0.2 });
    const podium = new THREE.Mesh(podiumGeo, podiumMat);
    podium.position.y = 0.04;
    podium.receiveShadow = true;
    scene.add(podium);

    // Kim tuyến lấp lánh (Sparkles)
    const sparklesCount = 180;
    const sparkleGeo = new THREE.BufferGeometry();
    const sparklePositions = new Float32Array(sparklesCount * 3);
    for (let i = 0; i < sparklesCount * 3; i += 3) {
      sparklePositions[i] = (Math.random() - 0.5) * 4.5;
      sparklePositions[i + 1] = Math.random() * 2.8 + 0.1;
      sparklePositions[i + 2] = (Math.random() - 0.5) * 4.0;
    }
    sparkleGeo.setAttribute('position', new THREE.BufferAttribute(sparklePositions, 3));
    const sparkleMat = new THREE.PointsMaterial({
      color: 0xffe600,
      size: 0.04,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });
    const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
    scene.add(sparkles);

    /* =========================================================
       4. CHARACTER LOADING & MATERIAL SMART-BINDING
       ========================================================= */
    const princessGroup = new THREE.Group();
    scene.add(princessGroup);

    // Danh sách material tìm thấy trên model để thao tác đổi màu
    let characterMaterials = {
      hair: [],
      dress: [],
      skin: [],
      eyes: [],
      accessories: []
    };

    const gltfLoader = new THREE.GLTFLoader();

    // URL Mô hình 3D phong cách Anime / Công chúa chuẩn (Mẫu sẵn sàng chất lượng cao)
    const DEFAULT_MODEL_URL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb'; // Fallback link
    // Sử dụng link mô hình nhân vật hoạt hình sẵn có
    const PRINCESS_MODEL_URL = 'https://models.readyplayer.me/648a73b186b5ee44a8677c70.glb'; // Full body stylized character

    function loadModel(urlOrBuffer) {
      document.getElementById('loading-overlay').classList.remove('opacity-0', 'pointer-events-none');
      
      const onLoaded = (gltf) => {
        while (princessGroup.children.length > 0) {
          princessGroup.remove(princessGroup.children[0]);
        }
        
        characterMaterials = { hair: [], dress: [], skin: [], eyes: [], accessories: [] };

        const model = gltf.scene;

        // Tự động căn chỉnh kích thước và vị trí cân đối ở giữa sân khấu
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        
        const targetHeight = 1.6; // Chiều cao chuẩn công chúa
        const scale = targetHeight / (size.y || 1);
        model.scale.setScalar(scale);

        // Đặt chân sát mặt đất
        box.setFromObject(model);
        model.position.y = -box.min.y + 0.08;
        model.position.x = -center.x * scale;
        model.position.z = -center.z * scale;

        // Phân loại và clone Material để cho phép đổi màu linh hoạt
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            
            if (child.material) {
              // Clone để không ảnh hưởng texture gốc nếu có
              child.material = child.material.clone();
              const matName = (child.material.name || child.name || '').toLowerCase();
              
              if (matName.includes('hair') || matName.includes('toc')) {
                characterMaterials.hair.push(child.material);
              } else if (matName.includes('skin') || matName.includes('body') || matName.includes('head') || matName.includes('face')) {
                characterMaterials.skin.push(child.material);
              } else if (matName.includes('eye')) {
                characterMaterials.eyes.push(child.material);
              } else if (matName.includes('outfit') || matName.includes('top') || matName.includes('bottom') || matName.includes('dress')) {
                characterMaterials.dress.push(child.material);
              } else {
                characterMaterials.dress.push(child.material);
              }
            }
          }
        });

        princessGroup.add(model);
        applyAllMaterialColors();

        document.getElementById('loading-overlay').classList.add('opacity-0', 'pointer-events-none');
      };

      if (typeof urlOrBuffer === 'string') {
        gltfLoader.load(urlOrBuffer, onLoaded, undefined, (err) => {
          console.warn('Không tải được link trực tiếp, tải mô hình cục bộ...', err);
          document.getElementById('loading-overlay').classList.add('opacity-0', 'pointer-events-none');
        });
      } else {
        gltfLoader.parse(urlOrBuffer, '', onLoaded, (err) => {
          console.error('Lỗi parse file GLB:', err);
          alert('Không thể đọc file 3D này.');
          document.getElementById('loading-overlay').classList.add('opacity-0', 'pointer-events-none');
        });
      }
    }

    function applyAllMaterialColors() {
      // Đổi màu Tóc
      characterMaterials.hair.forEach(m => {
        if (m.color) m.color.set(appState.outfit.hairColor);
      });
      // Đổi màu Váy / Trang phục
      characterMaterials.dress.forEach(m => {
        if (m.color) m.color.set(appState.outfit.dressColor);
      });
      // Đổi màu Da
      characterMaterials.skin.forEach(m => {
        if (m.color) m.color.set(appState.makeup.skinTone);
      });
    }

    /* Kéo thả file .glb từ máy tính vào để xem trực tiếp */
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => loadModel(e.target.result);
        reader.readAsArrayBuffer(file);
      }
    }

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.name.endsWith('.glb') || file.name.endsWith('.gltf')) {
          const reader = new FileReader();
          reader.onload = (ev) => loadModel(ev.target.result);
          reader.readAsArrayBuffer(file);
        }
      }
    });

    /* =========================================================
       5. UI RENDER ENGINE (Tabs & Panels)
       ========================================================= */
    function switchTab(tab) {
      appState.activeTab = tab;
      saveState();

      ['makeup', 'hair', 'outfit'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (!btn) return;
        if (t === tab) {
          btn.className = "px-4 py-2 rounded-2xl font-bold text-sm bg-pink-500 text-white shadow-md transition flex items-center gap-1.5 whitespace-nowrap";
        } else {
          btn.className = "px-4 py-2 rounded-2xl font-bold text-sm bg-pink-50 text-pink-700 hover:bg-pink-100 transition flex items-center gap-1.5 whitespace-nowrap";
        }
      });

      if (tab === 'makeup' && appState.cameraMode !== 'FACE') setCameraView('FACE');
      if (tab === 'hair' && appState.cameraMode !== 'UPPER') setCameraView('UPPER');
      if (tab === 'outfit' && appState.cameraMode !== 'BODY') setCameraView('BODY');

      renderActiveTab();
    }

    function renderActiveTab() {
      const container = document.getElementById('panel-content');
      container.innerHTML = '';

      if (appState.activeTab === 'makeup') {
        renderMakeupControls(container);
      } else if (appState.activeTab === 'hair') {
        renderHairControls(container);
      } else if (appState.activeTab === 'outfit') {
        renderOutfitControls(container);
      }
      lucide.createIcons();
    }

    function renderMakeupControls(el) {
      const skinTones = ['#ffdfd3', '#ffe8d6', '#fcd5b5', '#c68642', '#8d5524'];
      const lipColors = ['#e63946', '#ff4d6d', '#c9184a', '#ff758f', '#9d0208'];

      el.innerHTML = `
        <div>
          <label class="text-xs font-bold text-pink-900 block mb-1.5">Làn Da Công Chúa:</label>
          <div class="flex gap-2">
            ${skinTones.map(c => `
              <button onclick="setSkinColor('${c}')" class="w-8 h-8 rounded-full border-2 transition transform active:scale-90 ${appState.makeup.skinTone === c ? 'border-pink-600 scale-110 shadow-md' : 'border-white'}" style="background-color: ${c}"></button>
            `).join('')}
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-pink-900 block mb-1.5">Màu Son Môi:</label>
          <div class="flex gap-2 flex-wrap">
            ${lipColors.map(c => `
              <button onclick="setLipColor('${c}')" class="w-8 h-8 rounded-full border-2 transition transform active:scale-90 ${appState.makeup.lipColor === c ? 'border-pink-600 scale-110 shadow-md' : 'border-white'}" style="background-color: ${c}"></button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderHairControls(el) {
      const hairColors = ['#d4a373', '#4a2c11', '#1a1a1a', '#ffd166', '#d90429', '#9b5de5'];
      el.innerHTML = `
        <div>
          <label class="text-xs font-bold text-pink-900 block mb-1.5">Màu Mái Tóc Hoàng Gia:</label>
          <div class="flex gap-2 flex-wrap">
            ${hairColors.map(c => `
              <button onclick="setHairColor('${c}')" class="w-9 h-9 rounded-full border-2 transition transform active:scale-90 ${appState.outfit.hairColor === c ? 'border-pink-600 scale-110 shadow-md' : 'border-white'}" style="background-color: ${c}"></button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderOutfitControls(el) {
      const dressPresets = [
        { name: 'Hồng Công Chúa', color: '#ec4899' },
        { name: 'Tím Dạ Hội', color: '#8b5cf6' },
        { name: 'Xanh Biển Cả', color: '#3b82f6' },
        { name: 'Hoàng Kim', color: '#eab308' },
        { name: 'Bạch Tuyết', color: '#f8fafc' },
        { name: 'Ngọc Lục Bảo', color: '#10b981' }
      ];

      el.innerHTML = `
        <div>
          <label class="text-xs font-bold text-pink-900 block mb-1.5">Bộ Sưu Tập Váy Dạ Hội:</label>
          <div class="grid grid-cols-2 gap-2">
            ${dressPresets.map(p => `
              <button onclick="setDressColor('${p.color}')" class="p-2.5 rounded-2xl font-bold text-xs border-2 transition flex items-center gap-2 ${appState.outfit.dressColor === p.color ? 'border-pink-500 bg-pink-50 text-pink-700 shadow-sm' : 'border-gray-200 bg-white text-gray-700'}">
                <span class="w-5 h-5 rounded-full border shadow-sm" style="background-color: ${p.color}"></span>
                <span>${p.name}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* Actions */
    window.setSkinColor = (c) => { appState.makeup.skinTone = c; saveState(); applyAllMaterialColors(); renderActiveTab(); };
    window.setLipColor = (c) => { appState.makeup.lipColor = c; saveState(); applyAllMaterialColors(); renderActiveTab(); };
    window.setHairColor = (c) => { appState.outfit.hairColor = c; saveState(); applyAllMaterialColors(); renderActiveTab(); };
    window.setDressColor = (c) => { appState.outfit.dressColor = c; saveState(); applyAllMaterialColors(); renderActiveTab(); };

    /* =========================================================
       6. CHỤP ẢNH & LƯU VỀ MÁY (Photo Booth)
       ========================================================= */
    function takeSnapshot() {
      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');
      
      const link = document.createElement('a');
      link.download = `cong-chua-xinh-dep-${Date.now()}.png`;
      link.href = dataUrl;
      link.click();

      const flash = document.createElement('div');
      flash.className = 'fixed inset-0 bg-white z-50 pointer-events-none transition-opacity duration-500 opacity-80';
      document.body.appendChild(flash);
      setTimeout(() => {
        flash.classList.add('opacity-0');
        setTimeout(() => flash.remove(), 500);
      }, 50);
    }

    /* =========================================================
       7. ANIMATION LOOP & RESIZE
       ========================================================= */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Camera lerp mượt mà
      camera.position.lerp(targetCameraPos, 0.05);
      controls.target.lerp(targetCameraLook, 0.05);
      controls.update();

      // Hoạt ảnh nhân vật thở nhẹ
      princessGroup.position.y = Math.sin(elapsedTime * 2.0) * 0.008;

      // Xoay bụi kim tuyến
      sparkles.rotation.y = elapsedTime * 0.04;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Khởi động
    renderActiveTab();
    setCameraView(appState.cameraMode);
    loadModel(PRINCESS_MODEL_URL);
    animate();
    lucide.createIcons();
  </script>
</body>
</html>
