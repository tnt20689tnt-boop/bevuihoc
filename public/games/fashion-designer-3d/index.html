<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bé Học Vui — Fashion Designer 3D</title>
<style>
  :root{
    --pink:#ffd6e8; --pink2:#ff9ec7; --purple:#c9b6ff; --blue:#bfe3ff;
    --yellow:#fff3b0; --mint:#c8f7dc; --ink:#5a4a6a; --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#ffeef6;color:var(--ink);}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  /* ---------- Loading ---------- */
  #loading{position:fixed;inset:0;background:linear-gradient(135deg,#ffd6e8,#c9b6ff);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .6s;}
  #loading h1{font-size:2rem;color:#fff;text-shadow:0 3px 10px rgba(180,120,220,.5);margin-bottom:14px;}
  #loading .bar{width:220px;height:14px;background:#ffffff88;border-radius:99px;overflow:hidden;}
  #loading .bar>div{height:100%;width:40%;background:#fff;border-radius:99px;animation:load 1.2s infinite ease-in-out;}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}

  /* ---------- Top bar ---------- */
  #topbar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:20;pointer-events:none;}
  #topbar>*{pointer-events:auto;}
  .brand{background:#ffffffdd;border-radius:99px;padding:8px 16px;font-weight:800;color:#e05a9b;box-shadow:0 4px 14px rgba(230,120,180,.25);font-size:.95rem;white-space:nowrap;}
  .chip{background:#ffffffdd;border:none;border-radius:99px;padding:8px 14px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 4px 12px rgba(150,110,200,.2);font-size:.85rem;transition:.15s;}
  .chip:hover{transform:translateY(-2px);background:#fff;}
  .chip.active{background:linear-gradient(135deg,#ff9ec7,#c9b6ff);color:#fff;}
  #movePad{position:fixed;left:12px;bottom:12px;z-index:20;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;}
  #movePad button{border:none;border-radius:14px;background:#ffffffcc;font-size:1.1rem;color:#e05a9b;font-weight:800;box-shadow:0 3px 10px rgba(200,120,190,.25);cursor:pointer;}
  #movePad button:active{background:var(--pink2);color:#fff;}
  #movePad .up{grid-column:2;grid-row:1}#movePad .left{grid-column:1;grid-row:2}#movePad .down{grid-column:2;grid-row:3}#movePad .right{grid-column:3;grid-row:2}#movePad .mid{grid-column:2;grid-row:2;background:#fff0f7}

  /* ---------- Panel ---------- */
  #panel{position:fixed;top:64px;right:10px;bottom:12px;width:330px;max-width:calc(100vw - 20px);background:#ffffffee;backdrop-filter:blur(10px);border-radius:22px;box-shadow:0 10px 40px rgba(180,120,220,.3);z-index:19;display:flex;flex-direction:column;overflow:hidden;transition:transform .35s cubic-bezier(.4,1.4,.6,1);}
  #panel.hidden{transform:translateX(calc(100% + 20px));}
  #tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:2px solid #ffe3f1;}
  .tab{flex:1;min-width:56px;border:none;border-radius:12px;padding:8px 4px;font-size:.72rem;font-weight:800;color:#a08bb5;background:#f6eefc;cursor:pointer;transition:.15s;}
  .tab.active{background:linear-gradient(135deg,#ff9ec7,#c9b6ff);color:#fff;box-shadow:0 3px 10px rgba(220,130,200,.4);}
  #panelBody{flex:1;overflow-y:auto;padding:12px;}
  #panelBody::-webkit-scrollbar{width:6px}#panelBody::-webkit-scrollbar-thumb{background:#e5c9f2;border-radius:99px}
  .secTitle{font-size:.8rem;font-weight:800;color:#c07bb0;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.5px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .item{background:#fdf7ff;border:2px solid #f2e3fb;border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;transition:.15s;user-select:none;}
  .item:hover{transform:translateY(-2px);border-color:#ffb8d9;}
  .item.active{border-color:#ff7fb8;background:#ffe9f4;box-shadow:0 3px 10px rgba(255,127,184,.3);}
  .sw{width:34px;height:34px;border-radius:50%;margin:0 auto 4px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .item .n{font-size:.62rem;font-weight:700;color:#8a759c;line-height:1.1;}
  .rowBtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .btn{flex:1;min-width:90px;border:none;border-radius:14px;padding:10px;font-weight:800;font-size:.78rem;color:#fff;cursor:pointer;transition:.15s;box-shadow:0 4px 12px rgba(200,120,190,.3);}
  .btn:active{transform:scale(.95);}
  .btn.pink{background:linear-gradient(135deg,#ff9ec7,#ff7fb8);}
  .btn.purple{background:linear-gradient(135deg,#c9b6ff,#a98ef0);}
  .btn.blue{background:linear-gradient(135deg,#8fd0ff,#5aa9f0);}
  .btn.mint{background:linear-gradient(135deg,#7fe0b0,#4cc38a);}
  .btn.gray{background:linear-gradient(135deg,#cbb9d9,#a893bd);}
  .favRow{display:flex;align-items:center;gap:8px;background:#fdf3ff;border-radius:12px;padding:8px;margin-bottom:8px;}
  .favRow img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#eee;}
  .favRow .t{flex:1;font-size:.75rem;font-weight:700;}
  .favRow button{border:none;border-radius:8px;padding:6px 10px;font-size:.7rem;font-weight:800;cursor:pointer;color:#fff;}
  #togglePanel{position:fixed;top:64px;right:10px;z-index:21;border:none;border-radius:99px;padding:10px 14px;background:linear-gradient(135deg,#ff9ec7,#c9b6ff);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(220,130,200,.45);transition:.2s;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#5a4a6add;color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;font-size:.85rem;z-index:50;transition:.3s;pointer-events:none;}
  #toast.show{transform:translateX(-50%) translateY(0);}
  #areaBtns{position:fixed;left:12px;bottom:160px;z-index:20;display:flex;flex-direction:column;gap:6px;}
  #areaBtns button{border:none;border-radius:99px;padding:7px 12px;background:#ffffffd0;font-size:.7rem;font-weight:800;color:#a06bd0;cursor:pointer;box-shadow:0 3px 10px rgba(160,107,208,.25);}
  #areaBtns button:hover{background:#f3e6ff;}
  @media (max-width:640px){
    #panel{top:auto;right:8px;left:8px;bottom:8px;width:auto;height:46%;border-radius:20px 20px 0 0;}
    #panel.hidden{transform:translateY(calc(100% + 20px));}
    #togglePanel{top:auto;bottom:calc(46% + 16px);right:8px;}
    #panel.hidden ~ #togglePanel{bottom:16px;}
    #movePad{left:8px;bottom:auto;top:120px;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);}
    #areaBtns{left:8px;bottom:auto;top:56px;flex-direction:row;flex-wrap:wrap;max-width:70vw;}
    .brand{font-size:.75rem;padding:6px 10px;}
  }
</style>
</head>
<body>
<div id="loading"><h1>🎀 Fashion Designer 3D 🎀</h1><div class="bar"><div></div></div></div>
<div id="app"></div>

<div id="topbar">
  <div class="brand">🎀 Bé Học Vui • Fashion 3D</div>
  <button class="chip" id="btnIdle">🧍 Đứng</button>
  <button class="chip" id="btnWalkAnim">🚶 Đi bộ</button>
  <button class="chip" id="btnWave">👋 Vẫy tay</button>
  <button class="chip" id="btnSpin">🌀 Xoay</button>
  <button class="chip" id="btnJump">🐰 Nhảy</button>
</div>

<div id="areaBtns">
  <button data-area="runway">🌟 Sàn diễn</button>
  <button data-area="makeup">💄 Trang điểm</button>
  <button data-area="wardrobe">👗 Tủ váy</button>
  <button data-area="photo">📸 Chụp ảnh</button>
  <button data-area="sofa">🛋️ Sofa</button>
</div>

<div id="movePad">
  <button class="up" data-k="up">▲</button>
  <button class="left" data-k="left">◀</button>
  <button class="mid" data-k="mid">●</button>
  <button class="right" data-k="right">▶</button>
  <button class="down" data-k="down">▼</button>
</div>

<button id="togglePanel">🎨 Tủ đồ</button>
<div id="panel">
  <div id="tabs"></div>
  <div id="panelBody"></div>
</div>
<div id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   FASHION DESIGNER 3D — studio thờ trang cao cấp cho bé
   ============================================================ */

// ---------- Renderer / Scene / Camera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffeaf4);
scene.fog = new THREE.Fog(0xffeaf4, 30, 70);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(6, 4.2, 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.2;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 1.1, 0);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xfff5fa, 0xd9c2e8, 0.85));
const sun = new THREE.DirectionalLight(0xfff0dd, 1.1);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18; sun.shadow.camera.bottom = -18;
scene.add(sun);

// ---------- Helpers ----------
const M = (c, r=0.55, m=0.05) => new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m });
const PASTELS = [0xffc2dd,0xc9b6ff,0xbfe3ff,0xfff3b0,0xc8f7dc,0xffd9b3,0xff9ec7,0xa8e6cf,0xffb7b2,0xdcd3ff];
function mesh(geo, mat, x=0,y=0,z=0, cast=true, recv=true){ const o=new THREE.Mesh(geo,mat); o.position.set(x,y,z); o.castShadow=cast; o.receiveShadow=recv; return o; }

// ---------- Sàn bóng + tường ----------
const floor = mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color:0xfdeaf3, roughness:0.18, metalness:0.35 }), 0,0,0, false, true);
floor.rotation.x = -Math.PI/2;
scene.add(floor);
// thảm tròi trung tâm
const rug = mesh(new THREE.CircleGeometry(4.2, 48), M(0xffd6e8, 0.9), 0, 0.012, 2.5, false, true);
rug.rotation.x = -Math.PI/2; scene.add(rug);
const rugRing = mesh(new THREE.RingGeometry(4.2, 4.55, 48), M(0xffffff, 0.9), 0, 0.014, 2.5, false, true);
rugRing.rotation.x = -Math.PI/2; scene.add(rugRing);

function wall(w,h,x,y,z,ry,color=0xfbe4f2){
  const wd = mesh(new THREE.PlaneGeometry(w,h), M(color, 0.95), x, y, z, false, true);
  wd.rotation.y = ry; scene.add(wd); return wd;
}
wall(40, 10, 0, 5, -14, 0);          // tường sau
wall(40, 10, -16, 5, 0, Math.PI/2);  // tường trái
wall(40, 10, 16, 5, 0, -Math.PI/2);  // tường phải
// cửa sổ sáng trên tường sau
for (let i=-2;i<=2;i++){
  const win = mesh(new THREE.PlaneGeometry(3.4,4.6), new THREE.MeshStandardMaterial({color:0xfff9e0, emissive:0xfff3c0, emissiveIntensity:0.7, roughness:0.4}), i*6.5, 4.6, -13.95, false, false);
  scene.add(win);
  scene.add(mesh(new THREE.BoxGeometry(3.6,0.15,0.1), M(0xffffff,0.6), i*6.5, 7, -13.9));
  scene.add(mesh(new THREE.BoxGeometry(3.6,0.15,0.1), M(0xffffff,0.6), i*6.5, 2.2, -13.9));
}

// ---------- RUNWAY sàn diễn ----------
const runway = new THREE.Group();
const rwBase = mesh(new THREE.BoxGeometry(2.6, 0.35, 12), M(0xffffff, 0.15, 0.4), 0, 0.175, -6);
runway.add(rwBase);
const rwTop = mesh(new THREE.BoxGeometry(2.4, 0.06, 11.8), new THREE.MeshStandardMaterial({color:0xffd6e8, roughness:0.08, metalness:0.6}), 0, 0.37, -6, false, true);
runway.add(rwTop);
// đèn 2 bên runway
const sideLights = [];
for (let z=-11; z<=-1; z+=2){
  for (const sx of [-1.7, 1.7]){
    const lamp = mesh(new THREE.CylinderGeometry(0.1,0.14,0.9,8), M(0xdcc8f0,0.4,0.6), sx, 0.45, z);
    const bulb = mesh(new THREE.SphereGeometry(0.14,12,12), new THREE.MeshStandardMaterial({color:0xfff2b0, emissive:0xffe27a, emissiveIntensity:2.2}), sx, 0.95, z, false, false);
    runway.add(lamp, bulb);
  }
}
// khung backdrop cuối runway
runway.add(mesh(new THREE.BoxGeometry(5.4,0.25,0.25), M(0xc9b6ff,0.4,0.5), 0, 3.6, -12));
runway.add(mesh(new THREE.BoxGeometry(0.25,3.6,0.25), M(0xc9b6ff,0.4,0.5), -2.6, 1.8, -12));
runway.add(mesh(new THREE.BoxGeometry(0.25,3.6,0.25), M(0xc9b6ff,0.4,0.5), 2.6, 1.8, -12));
scene.add(runway);
// sàn catwalk mở rộng cuối runway
scene.add(mesh(new THREE.CylinderGeometry(2.8,2.8,0.35,32), M(0xffffff,0.15,0.4), 0, 0.175, -12));
// spotlight chiếu ngườ mẫu
const spot = new THREE.SpotLight(0xfff0fa, 60, 30, Math.PI/7, 0.45, 1.6);
spot.position.set(0, 9, -4); spot.castShadow = true;
const spotTarget = new THREE.Object3D(); scene.add(spotTarget);
spot.target = spotTarget; scene.add(spot);

// ---------- Kim tuyến (sparkles) ----------
function makeSparkles(cx, cz, w, d, n, color=0xffd700){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){ pos[i*3]=cx+(Math.random()-0.5)*w; pos[i*3+1]=Math.random()*4; pos[i*3+2]=cz+(Math.random()-0.5)*d; }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color, size:0.08, transparent:true, opacity:0.9, depthWrite:false, blending:THREE.AdditiveBlending }));
  scene.add(p); return p;
}
const spark1 = makeSparkles(0,-6, 3, 12, 220);
const spark2 = makeSparkles(0, 2.5, 8, 8, 160, 0xffb8e6);

// ---------- Khu tủ váy (phải) ----------
const wardrobe = new THREE.Group();
function rack(x, z, ry, colors){
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(0.05,0.05,2.2,8), M(0xe8c8a0,0.5), -0.9, 1.1, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.05,0.05,2.2,8), M(0xe8c8a0,0.5), 0.9, 1.1, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.04,0.04,1.9,8), M(0xd9a86c,0.4,0.5), 0, 2.1, 0)).rotation.z = Math.PI/2;
  colors.forEach((c,i)=>{
    const dx = -0.7 + i*0.35;
    g.add(mesh(new THREE.CylinderGeometry(0.02,0.02,0.3,6), M(0xbbbbbb,0.3,0.8), dx, 1.95, 0));
    const dress = mesh(new THREE.ConeGeometry(0.22, 0.9, 10), M(c,0.6), dx, 1.4, 0);
    g.add(dress);
  });
  g.position.set(x, 0, z); g.rotation.y = ry;
  wardrobe.add(g);
}
rack(10.5, -6, -Math.PI/2.4, [0xff9ec7,0xc9b6ff,0xfff3b0,0xbfe3ff,0xc8f7dc]);
rack(12.5, -2.5, -Math.PI/2.2, [0xff7fb8,0xa8e6cf,0xffd9b3,0xdcd3ff,0xffb7b2]);
rack(13, 1.5, -Math.PI/2, [0xffc2dd,0x9be0ff,0xffe28a,0xbaffd0,0xe0b3ff]);
// mannequin trưng bày
function mannequin(x, z, dressColor, ry=0){
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(0.04,0.3,0.12,12), M(0xdddddd,0.3,0.7), 0, 0.06, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.03,0.03,1.0,8), M(0xcccccc,0.3,0.7), 0, 0.6, 0));
  g.add(mesh(new THREE.SphereGeometry(0.13,10,10), M(0xf5e6d8,0.6), 0, 1.55, 0));
  g.add(mesh(new THREE.ConeGeometry(0.34, 1.0, 14), M(dressColor,0.5), 0, 1.0, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.15,0.2,0.45,10), M(dressColor,0.5), 0, 1.42, 0));
  g.position.set(x,0,z); g.rotation.y = ry;
  wardrobe.add(g);
}
mannequin(10, 4.5, 0xffc2dd, -0.6);
mannequin(12.5, 5.5, 0xc9b6ff, -0.9);
mannequin(14.5, 4, 0xfff3b0, -1.2);
// kệ giày/túi
const shelf = mesh(new THREE.BoxGeometry(3, 0.12, 0.9), M(0xffffff,0.6), 13.5, 0.8, 7.5);
wardrobe.add(shelf);
wardrobe.add(mesh(new THREE.BoxGeometry(3, 0.12, 0.9), M(0xffffff,0.6), 13.5, 1.6, 7.5));
wardrobe.add(mesh(new THREE.BoxGeometry(3, 0.12, 0.9), M(0xffffff,0.6), 13.5, 2.4, 7.5));
wardrobe.add(mesh(new THREE.BoxGeometry(0.12, 2.5, 0.9), M(0xf0d8ea,0.6), 12.1, 1.25, 7.5));
wardrobe.add(mesh(new THREE.BoxGeometry(0.12, 2.5, 0.9), M(0xf0d8ea,0.6), 14.9, 1.25, 7.5));
for (let i=0;i<6;i++){
  wardrobe.add(mesh(new THREE.SphereGeometry(0.14,10,8), M(PASTELS[i%10],0.5), 12.4+(i%3)*1.0, 0.95+Math.floor(i/3)*0.8, 7.5));
}
scene.add(wardrobe);

// ---------- Khu trang điểm (trái) ----------
const makeupZone = new THREE.Group();
const table = mesh(new THREE.BoxGeometry(3.4, 0.14, 1.1), M(0xffffff,0.4), -11.5, 0.95, -4);
makeupZone.add(table);
makeupZone.add(mesh(new THREE.BoxGeometry(0.14, 0.95, 0.9), M(0xffd6e8,0.5), -12.9, 0.48, -4));
makeupZone.add(mesh(new THREE.BoxGeometry(0.14, 0.95, 0.9), M(0xffd6e8,0.5), -10.1, 0.48, -4));
// gương tròn + bóng đèn
const mirror = mesh(new THREE.CircleGeometry(0.85, 32), new THREE.MeshStandardMaterial({color:0xeaf6ff, roughness:0.05, metalness:0.9}), -11.5, 2.3, -4.55, false, false);
makeupZone.add(mirror);
makeupZone.add(mesh(new THREE.TorusGeometry(0.88, 0.06, 10, 40), M(0xffd700,0.3,0.8), -11.5, 2.3, -4.54));
for (let a=0; a<Math.PI*2; a+=Math.PI/6){
  const bx = -11.5 + Math.cos(a)*1.05, by = 2.3 + Math.sin(a)*1.05;
  makeupZone.add(mesh(new THREE.SphereGeometry(0.07,8,8), new THREE.MeshStandardMaterial({color:0xfff2b0, emissive:0xffe27a, emissiveIntensity:2}), bx, by, -4.5, false, false));
}
// ghế trang điểm
makeupZone.add(mesh(new THREE.CylinderGeometry(0.35,0.4,0.55,16), M(0xff9ec7,0.6), -11.5, 0.28, -2.6));
makeupZone.add(mesh(new THREE.CylinderGeometry(0.05,0.05,0.35,8), M(0xcccccc,0.4,0.6), -11.5, 0.75, -2.6));
// lọ mỹ phẩm trên bàn
for (let i=0;i<5;i++){
  makeupZone.add(mesh(new THREE.CylinderGeometry(0.06,0.07,0.22,8), M(PASTELS[(i*3)%10],0.4), -12.6+i*0.55, 1.13, -4.15));
}
scene.add(makeupZone);

// ---------- Gương lớn trang trí tường ----------
function bigMirror(x, z, ry){
  const g = new THREE.Group();
  g.add(mesh(new THREE.CircleGeometry(1.5, 40), new THREE.MeshStandardMaterial({color:0xdff2ff, roughness:0.04, metalness:0.95}), 0, 2.6, 0, false, false));
  g.add(mesh(new THREE.TorusGeometry(1.55, 0.1, 10, 48), M(0xffd700,0.25,0.9), 0, 2.6, 0.01));
  g.position.set(x,0,z); g.rotation.y = ry;
  scene.add(g);
}
bigMirror(-15.8, 3, Math.PI/2);
bigMirror(15.8, -6, -Math.PI/2);
bigMirror(6, -13.85, 0);

// ---------- Sofa + khu thư giãn ----------

const hairG = new THREE.Group(); headG.add(hairG);
function buildHair(style, color){
  hairG.clear();
  hairG.scale.set(1.12, 1.10, 1.08);
  hairMat.color.setHex(color);
  const cap = mesh(new THREE.SphereGeometry(0.38, 32, 24, 0, Math.PI*2, 0, Math.PI*0.55), hairMat, 0, 0.235, -0.005);
  cap.rotation.x = -0.28; hairG.add(cap);
  const bang = mesh(new THREE.SphereGeometry(0.35, 24, 16, 0, Math.PI*2, 0, Math.PI*0.35), hairMat, 0, 0.30, 0.04);
  bang.rotation.x = -0.55; hairG.add(bang);
  const add = (g,x,y,z)=>{ const o=mesh(g,hairMat,x,y,z); hairG.add(o); return o; };
  if (style==='long'){
    add(new THREE.BoxGeometry(0.42,0.75,0.14), 0, -0.08, -0.24);
    add(new THREE.SphereGeometry(0.09,8,8), 0.14, 0.36, 0.14);
    add(new THREE.SphereGeometry(0.09,8,8), -0.14, 0.36, 0.14);
  } else if (style==='short'){
    add(new THREE.SphereGeometry(0.29,14,10,0,Math.PI*2,0,Math.PI*0.6), 0, 0.22, -0.04).rotation.x=-0.3;
  } else if (style==='curly'){
    for (let i=0;i<8;i++){
      const a = i/8*Math.PI*1.5+Math.PI*0.75;
      add(new THREE.SphereGeometry(0.11,10,8), Math.cos(a)*0.27, 0.30+Math.sin(a)*0.22, Math.sin(a*2)*0.05);
    }
    add(new THREE.SphereGeometry(0.12,10,8), 0, 0.52, -0.05);
  } else if (style==='bun'){
    add(new THREE.SphereGeometry(0.15,12,10), 0, 0.58, -0.08);
    add(new THREE.TorusGeometry(0.15,0.03,8,20), M(0xffd700,0.3,0.8), 0, 0.58, -0.08);
  } else if (style==='ponytail'){
    const p = add(new THREE.ConeGeometry(0.13,0.6,10), 0, 0.15, -0.42);
    p.rotation.x = 0.5;
    add(new THREE.SphereGeometry(0.14,10,8), 0, 0.5, -0.28);
  } else if (style==='pigtails'){
    add(new THREE.SphereGeometry(0.13,10,8), 0.32, 0.42, -0.05);
    add(new THREE.SphereGeometry(0.13,10,8), -0.32, 0.42, -0.05);
    const c1 = add(new THREE.ConeGeometry(0.11,0.5,10), 0.36, 0.05, -0.08); c1.rotation.x = Math.PI;
    const c2 = add(new THREE.ConeGeometry(0.11,0.5,10), -0.36, 0.05, -0.08); c2.rotation.x = Math.PI;
    add(new THREE.TorusGeometry(0.06,0.02,6,14), M(0xff7fb8,0.4), 0.32, 0.45, -0.05);
    add(new THREE.TorusGeometry(0.06,0.02,6,14), M(0xff7fb8,0.4), -0.32, 0.45, -0.05);
  } else if (style==='braids'){
    for (const sx of [1,-1]){
      for (let i=0;i<4;i++){
        add(new THREE.SphereGeometry(0.075-i*0.008,8,8), sx*(0.30+i*0.015), 0.28-i*0.17, 0.02);
      }
      add(new THREE.SphereGeometry(0.045,8,6), M(0xff7fb8,0.4), sx*0.345, -0.36, 0.02);
    }
  }
}

const dressG = new THREE.Group(); hips.add(dressG); dressG.position.set(0, 0.03, 0);
function latheGeo(profile, segs=24){
  const pts = profile.map(p=>new THREE.Vector2(p[0], p[1]));
  return new THREE.LatheGeometry(pts, segs);
}
let currentDress = null;
function buildDress(type, color){
  dressG.clear();
  dressMat = M(color, 0.42);
  const mk = (geo)=>{ const m = mesh(geo, dressMat); dressG.add(m); return m; };
  const trim = M(0xffffff, 0.6);
  if (type==='gown' || type==='wedding'){          // váy dạ hội / váy cưới
    mk(latheGeo([[0.30,0],[0.42,0.06],[0.40,0.2],[0.3,0.38],[0.22,0.52],[0.13,0.62]], dressMat));
    mk(new THREE.CylinderGeometry(0.13,0.17,0.3,14)).position.y = 0.74;
    // viền bèo
    const frill = mesh(new THREE.TorusGeometry(0.40,0.045,10,30), trim, 0, 0.16, 0);
    frill.rotation.x = Math.PI/2; dressG.add(frill);
    if (type==='wedding'){
      dressMat = M(0xffffff, 0.35);
      // voan tàu dài phía sau
      const train = mesh(new THREE.BoxGeometry(0.5,0.03,0.9), M(0xffffff,0.5,0.1), 0, 0.05, -0.55);
      dressG.add(train);
      // hoa trắng cài eo
      for (let i=0;i<5;i++){
        const a = i/5*Math.PI*2;
        dressG.add(mesh(new THREE.SphereGeometry(0.035,8,6), trim, Math.cos(a)*0.16, 0.6, Math.sin(a)*0.16));
      }
    }
  } else if (type==='princess'){                    // váy công chúa nhiều tầng
    mk(latheGeo([[0.36,0],[0.40,0.05],[0.34,0.16],[0.28,0.3],[0.16,0.45],[0.12,0.62]], dressMat));
    for (let i=0;i<3;i++){
      const r = 0.37 - i*0.09;
      const layer = mesh(new THREE.TorusGeometry(r,0.055,10,28), M(color,0.55), 0, 0.06+i*0.14, 0);
      layer.rotation.x = Math.PI/2; dressG.add(layer);
    }
    mk(new THREE.CylinderGeometry(0.12,0.15,0.26,12)).position.y = 0.72;
    // bờ vai phồng
    dressG.add(mesh(new THREE.SphereGeometry(0.09,10,8), dressMat, 0.2, 0.84, 0));
    dressG.add(mesh(new THREE.SphereGeometry(0.09,10,8), dressMat, -0.2, 0.84, 0));
  } else if (type==='tutu'){                        // váy ballet
    mk(new THREE.CylinderGeometry(0.12,0.13,0.28,12)).position.y = 0.68;
    const tutu = mesh(new THREE.TorusGeometry(0.3,0.09,12,28), M(color,0.6), 0, 0.5, 0);
    tutu.rotation.x = Math.PI/2; tutu.scale.z = 1.6; dressG.add(tutu);
    const tutu2 = mesh(new THREE.TorusGeometry(0.26,0.06,10,24), trim, 0, 0.47, 0);
    tutu2.rotation.x = Math.PI/2; tutu2.scale.z = 1.6; dressG.add(tutu2);
  } else if (type==='fairytale'){                   // váy cổ tích
    mk(latheGeo([[0.34,0],[0.38,0.08],[0.30,0.22],[0.2,0.4],[0.13,0.6]], dressMat));
    mk(new THREE.CylinderGeometry(0.13,0.16,0.28,12)).position.y = 0.72;
    // cánh tay áo chuông
    dressG.add(mesh(new THREE.ConeGeometry(0.09,0.22,10,1,true), dressMat, 0.24, 0.8, 0));
    dressG.add(mesh(new THREE.ConeGeometry(0.09,0.22,10,1,true), dressMat, -0.24, 0.8, 0));
    // đính sao nhỏ
    for (let i=0;i<10;i++){
      const a = Math.random()*Math.PI*2, r = 0.2+Math.random()*0.14;
      dressG.add(mesh(new THREE.SphereGeometry(0.018,6,6), new THREE.MeshStandardMaterial({color:0xfff3b0, emissive:0xffe27a, emissiveIntensity:1.5}), Math.cos(a)*r, 0.1+Math.random()*0.3, Math.sin(a)*r, false, false));
    }
  } else if (type==='summer'){                      // váy mùa hè ngắn nhẹ
    mk(latheGeo([[0.26,0.15],[0.30,0.22],[0.20,0.38],[0.13,0.58]], dressMat));
    mk(new THREE.CylinderGeometry(0.13,0.16,0.2,12)).position.y = 0.66;
    const hem = mesh(new THREE.TorusGeometry(0.27,0.03,8,24), trim, 0, 0.17, 0);
    hem.rotation.x = Math.PI/2; dressG.add(hem);
  } else if (type==='party'){                       // váy dự tiệc bóng
    mk(latheGeo([[0.30,0],[0.34,0.08],[0.24,0.3],[0.16,0.45],[0.13,0.62]], dressMat));
    mk(new THREE.CylinderGeometry(0.13,0.15,0.3,12)).position.y = 0.74;
    // đai sequin
    const belt = mesh(new THREE.TorusGeometry(0.155,0.03,8,20), new THREE.MeshStandardMaterial({color:0xffd700, roughness:0.2, metalness:0.9}), 0, 0.6, 0);
    belt.rotation.x = Math.PI/2; dressG.add(belt);
  } else if (type==='korean'){                      // váy Hàn Quốc dễ thương
    mk(latheGeo([[0.30,0.1],[0.32,0.2],[0.2,0.35],[0.14,0.55]], dressMat));
    mk(new THREE.CylinderGeometry(0.14,0.17,0.26,12)).position.y = 0.68;
    // tạp dề trắng
    const apron = mesh(new THREE.BoxGeometry(0.22,0.3,0.02), trim, 0, 0.35, 0.24);
    dressG.add(apron);
    // nơ ngực
    const bow1 = mesh(new THREE.ConeGeometry(0.05,0.1,8), M(0xff7fb8,0.5), 0.06, 0.78, 0.15);
    const bow2 = bow1.clone(); bow2.position.x = -0.06; bow2.rotation.y = Math.PI;
    dressG.add(bow1, bow2);
  } else if (type==='modern'){                      // váy hiện đại chữ A
    mk(latheGeo([[0.26,0],[0.30,0.1],[0.22,0.3],[0.16,0.5],[0.13,0.62]], dressMat));
    mk(new THREE.CylinderGeometry(0.13,0.15,0.3,12)).position.y = 0.74;
    // túi hộp
    dressG.add(mesh(new THREE.BoxGeometry(0.09,0.07,0.02), trim, 0.17, 0.32, 0.17));
    dressG.add(mesh(new THREE.BoxGeometry(0.09,0.07,0.02), trim, -0.17, 0.32, 0.17));

const outfitG = new THREE.Group(); body.add(outfitG);
let currentOutfit = null;
function buildOutfit(type, c1, c2){
  outfitG.clear();
  const A = M(c1, 0.5), B = M(c2, 0.55);
  const add = (g,x,y,z)=>{ const o = mesh(g,A,x,y,z); outfitG.add(o); return o; };
  if (type==='set_skirt'){          // áo + chân váy
    add(new THREE.CylinderGeometry(0.135,0.16,0.32,14), 0, 0.72, 0);
    add(new THREE.SphereGeometry(0.07,10,8), 0.19, 0.86, 0);
    add(new THREE.SphereGeometry(0.07,10,8), -0.19, 0.86, 0);
    const sk = mesh(latheGeo([[0.24,0],[0.28,0.06],[0.2,0.3],[0.15,0.42]], B), B, 0, 0.16, 0);
    outfitG.add(sk);
  } else if (type==='set_pants'){   // áo + quần
    add(new THREE.CylinderGeometry(0.135,0.16,0.32,14), 0, 0.72, 0);
    add(new THREE.SphereGeometry(0.07,10,8), 0.19, 0.86, 0);
    add(new THREE.SphereGeometry(0.07,10,8), -0.19, 0.86, 0);
    const p1 = mesh(new THREE.CylinderGeometry(0.085,0.075,0.5,10), B, 0.085, 0.32, 0);
    const p2 = mesh(new THREE.CylinderGeometry(0.085,0.075,0.5,10), B, -0.085, 0.32, 0);
    outfitG.add(p1, p2);
    const belt = mesh(new THREE.TorusGeometry(0.155,0.025,8,18), M(0xffd700,0.3,0.8), 0, 0.56, 0);
    belt.rotation.x = Math.PI/2; outfitG.add(belt);
  } else if (type==='sport'){       // thể thao
    add(new THREE.CylinderGeometry(0.14,0.16,0.3,14), 0, 0.72, 0);
    const sk2 = mesh(latheGeo([[0.22,0.1],[0.24,0.16],[0.17,0.32],[0.14,0.42]], B), B, 0, 0.16, 0);
    outfitG.add(sk2);
    // sọc áo
    outfitG.add(mesh(new THREE.TorusGeometry(0.145,0.018,6,16), M(0xffffff,0.6), 0, 0.78, 0)).rotation.x = Math.PI/2;

  } else if (type==='winter'){      // mùa đông áo khoác ấm

    outfitG.add(jacket);
    // lông viền cổ + tay áo
    outfitG.add(mesh(new THREE.TorusGeometry(0.13,0.04,8,16), M(0xffffff,0.9), 0, 0.76, 0)).rotation.x = Math.PI/2;
    outfitG.add(mesh(new THREE.CylinderGeometry(0.07,0.08,0.3,10), B, 0.23, 0.72, 0)).rotation.z = -0.15;
    outfitG.add(mesh(new THREE.CylinderGeometry(0.07,0.08,0.3,10), B, -0.23, 0.72, 0)).rotation.z = 0.15;
    // khăn quàng cổ (luôn có với đồ đông)
    const sc = mesh(new THREE.TorusGeometry(0.1,0.05,8,16), M(0xff7fb8,0.8), 0, 0.94, 0);
    sc.rotation.x = Math.PI/2; outfitG.add(sc);
  } else if (type==='royal'){       // hoàng gia
    add(new THREE.CylinderGeometry(0.135,0.16,0.34,14), 0, 0.7, 0);

    outfitG.add(skirt);

    cape.position.z = -0.06; outfitG.add(cape);

// trạng thái hiện tại
const state = {
  dress: { type:'princess', color:0xff9ec7 },
  outfit: null, // {type, c1, c2}
  hair: { style:'long', color:0x6b4a2f },
  accessories: new Set(),
  shoes: 'flats',
  skin: 0xffe0cc, lips: 0xe0607f, blush: 0xff9eb5, eyeshadow: 0xffb8d9, expression: 'smile',
};
let history = [];

function snapshot(){
  return JSON.stringify({ ...state, accessories:[...state.accessories] });
}
function pushHistory(){ history.push(snapshot()); if (history.length>40) history.shift(); }
function applyState(s){
  const d = JSON.parse(s);
  Object.assign(state, d); state.accessories = new Set(d.accessories);
  buildDress(state.dress.type, state.dress.color);
  if (state.outfit) buildOutfit(state.outfit.type, state.outfit.c1, state.outfit.c2);
  outfitG.visible = !!state.outfit;
  dressG.visible = !state.outfit; // mặc đồ rời thì giấu váy để không bị xuyên
  buildHair(state.hair.style, state.hair.color);
  buildShoes(state.shoes);
  buildMouth(state.expression);
  for (const k in acc) acc[k].visible = state.accessories.has(k);
  setGloves(state.accessories.has('gloves'), 0xfff0f5);
  skinMat.color.setHex(state.skin);
  cheekL.material.color.setHex(state.blush); cheekR.material.color.setHex(state.blush);
  shadowL.material.color.setHex(state.eyeshadow); shadowR.material.color.setHex(state.eyeshadow);
  lipColor = state.lips; buildMouth(state.expression);
  refreshActiveUI();
}
function setDress(type, color){ pushHistory(); state.dress={type,color}; buildDress(type,color); refreshActiveUI(); }
function setOutfit(type){ pushHistory(); state.outfit={type, c1:COLORS[Math.floor(Math.random()*COLORS.length)].c, c2:COLORS[Math.floor(Math.random()*COLORS.length)].c}; buildOutfit(type, state.outfit.c1, state.outfit.c2); outfitG.visible = true; refreshActiveUI(); }
function removeOutfit(){ pushHistory(); state.outfit=null; outfitG.visible=false; refreshActiveUI(); }
function setHair(style, color){ pushHistory(); state.hair={style,color}; buildHair(style,color); refreshActiveUI(); }
function setHairColor(color){ pushHistory(); state.hair.color=color; buildHair(state.hair.style,color); refreshActiveUI(); }
function toggleAccessory(id){ pushHistory(); state.accessories.has(id)?state.accessories.delete(id):state.accessories.add(id); acc[id].visible = state.accessories.has(id); if(id==='gloves') setGloves(acc.gloves.visible, 0xfff0f5); refreshActiveUI(); }
function setShoes(id){ pushHistory(); state.shoes=id; buildShoes(id); refreshActiveUI(); }
function setSkin(c){ pushHistory(); state.skin=c; skinMat.color.setHex(c); refreshActiveUI(); }
function setLips(c){ pushHistory(); state.lips=c; lipColor=c; buildMouth(state.expression); refreshActiveUI(); }
function setBlush(c){ pushHistory(); state.blush=c; cheekL.material.color.setHex(c); cheekR.material.color.setHex(c); refreshActiveUI(); }
function setEyeshadow(c){ pushHistory(); state.eyeshadow=c; shadowL.material.color.setHex(c); shadowR.material.color.setHex(c); refreshActiveUI(); }
function setExpression(e){ pushHistory(); state.expression=e; buildMouth(e); refreshActiveUI(); }

// phối đồ ngẫu nhiên
function randomOutfit(){
  pushHistory();
  const pick = a=>a[Math.floor(Math.random()*a.length)];
  const useOutfit = Math.random()<0.5;

// chế độ hành động

// chế độ sàn diễn
const runShow = { on:false, style:'classic', phase:'walkOut', t:0 };
function toggleRunway(){
  runShow.on = !runShow.on;
  if (runShow.on){
    runShow.phase='walkOut';
    char.position.set(0, 0.35, 1.2);
    char.rotation.y = Math.PI;
    spot.intensity = 60;
    toast('🌟 Bắt đầu trình diễn!'); sparkleBurst();
  } else { toast('⏹ Đã dừng trình diễn'); }
  renderTab('runway', true);

let burst = null;
function sparkleBurst(){
  if (burst) scene.remove(burst);
  burst = makeSparkles(char.position.x, char.position.z, 2, 2, 120, 0xffffff);
  setTimeout(()=>{ if(burst){scene.remove(burst); burst=null;} }, 2500);
}

function lerpAngle(a, b, t){
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return a + d * Math.min(1, t);
}

// ---------- vòng lặp animation ----------
const clock = new THREE.Clock();
let blinkT = 0, blinkOn = false;
let spinT = 0, jumpT = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // --- chớp mắt ---
  blinkT += dt;
  if (blinkT > 2.6){ blinkT = 0; blinkOn = true; }
  if (blinkOn){
    const s = Math.max(0.12, 1 - Math.sin(Math.min(1, blinkT*14))*0.95);
    eyeWhiteL.scale.y = eyeWhiteR.scale.y = pupilL.scale.y = pupilR.scale.y = s;
    if (blinkT > 0.15) { blinkOn = false; eyeWhiteL.scale.y = eyeWhiteR.scale.y = pupilL.scale.y = pupilR.scale.y = 1; }
  }

  let walking = false;
  const speed = 2.4;

  if (runShow.on){
    // --- trình diễn runway tự động ---
    animMode = 'runway';
    const endZ = -11.2;
    if (runShow.phase === 'walkOut'){
      char.position.z -= dt * 1.5;
      char.rotation.y = lerpAngle(char.rotation.y, Math.PI, dt*6);
      if (char.position.z <= endZ){ runShow.phase='turn'; runShow.t=0; sparkleBurst(); }
    } else if (runShow.phase === 'turn'){
      runShow.t += dt;
      char.rotation.y += dt * (runShow.style==='spin' ? 4.5 : 2.6);
      if (runShow.t > (runShow.style==='spin'?1.5:1.9)){ runShow.phase='pose'; runShow.t=0; }
    } else if (runShow.phase === 'pose'){
      runShow.t += dt;
      if (runShow.t > 1.6){ runShow.phase='walkBack'; }
    } else {
      char.position.z += dt * 1.5;
      char.rotation.y = lerpAngle(char.rotation.y, 0, dt*6);
      if (char.position.z >= 1.2){ runShow.phase='walkOut'; sparkleBurst(); }
    }
    // xoay theo hướng đi
    if (runShow.phase==='walkOut') char.rotation.y = Math.PI + Math.sin(t*6)*0.06;
    if (runShow.phase==='walkBack') char.rotation.y = Math.sin(t*6)*0.06;
  } else {
    // --- di chuyển tự do ---
    let dx=0, dz=0;
    if (keys.up) dz-=1; if (keys.down) dz+=1;
    if (keys.left) dx-=1; if (keys.right) dx+=1;
    if (moveTarget){
      const d = moveTarget.clone().sub(char.position); d.y=0;
      if (d.length() > 0.25){ dx = d.x; dz = d.z; }
      else { moveTarget = null; toast('✅ Đã tới nơi!'); }
    }
    if (dx||dz){
      const len = Math.hypot(dx,dz);
      const nx = char.position.x + dx/len*speed*dt;
      const nz = char.position.z + dz/len*speed*dt;
      // giới hạn trong phòng
      char.position.x = Math.max(-13.5, Math.min(13.5, nx));
      char.position.z = Math.max(-12.2, Math.min(11.2, nz));
      const targetYaw = Math.atan2(dx, dz);
      char.rotation.y = lerpAngle(char.rotation.y, targetYaw, dt*8);
      walking = true;
      if (animMode!=='spin' && animMode!=='jump') animMode='walk';
    } else if (animMode==='walk') animMode = 'idle';
  }

  // --- tạo dáng các tư thế ---
  const A = { // góc mục tiêu
    lLeg:0, rLeg:0, lArm:0, rArm:0, lArmZ:0.12, rArmZ:-0.12, bodyY:0, bodyRot:0, headTilt:0,
  };
  if (animMode==='walk' || (runShow.on && (runShow.phase==='walkOut'||runShow.phase==='walkBack'))){
    const w = t*9;
    A.lLeg = Math.sin(w)*0.65; A.rLeg = -Math.sin(w)*0.65;
    A.lArm = -Math.sin(w)*0.5; A.rArm = Math.sin(w)*0.5;
    A.bodyY = Math.abs(Math.sin(w))*0.04;
  } else if (animMode==='idle'){
    A.lArm = 0.05+Math.sin(t*1.4)*0.04; A.rArm = 0.05+Math.sin(t*1.4+1)*0.04;
    A.headTilt = Math.sin(t*0.8)*0.06;
    A.bodyY = Math.sin(t*2)*0.008;
  } else if (animMode==='wave' || (runShow.on && runShow.phase==='pose' && runShow.style==='wave')){
    A.rArmZ = -2.4 + Math.sin(t*7)*0.25; A.rArm = 0; A.lArm = 0.1;
    A.headTilt = Math.sin(t*2)*0.08;
  } else if (animMode==='spin'){
    spinT += dt; char.rotation.y += dt*5;
    A.lArmZ = 1.4; A.rArmZ = -1.4; A.lArm = A.rArm = -0.6;
    if (spinT > 1.2){ spinT=0; setMode('idle'); }
  } else if (animMode==='jump'){
    jumpT += dt*3;
    A.bodyY = Math.abs(Math.sin(jumpT*Math.PI))*0.35;
    A.lArmZ = 1.8; A.rArmZ = -1.8; A.lArm = A.rArm = -0.9;
    if (jumpT > 3){ jumpT=0; setMode('idle'); }
  }
  // tư thế tạo dáng (khi đứng yên hoặc chụp ảnh)
  if (!walking && !runShow.on && poseMode!=='stand' && (animMode==='idle'||animMode==='walk')){
    if (poseMode==='princess'){ A.lArmZ = 0.9; A.rArmZ = -0.9; A.lArm = A.rArm = -0.5; A.headTilt = -0.1; }
    if (poseMode==='runwaypose'){ A.rArmZ = -2.2; A.rArm = 0; A.lArm = 0.15; A.headTilt = 0.12; }
    if (poseMode==='cute'){ A.lArm = -2.4; A.rArm = -2.4; A.lArmZ = 0.5; A.rArmZ = -0.5; }
    if (poseMode==='sit'){ A.lLeg = A.rLeg = -1.4; A.bodyY = -0.25; }
  }
  if (poseMode==='jump' && !walking){ A.bodyY = Math.abs(Math.sin(t*4))*0.25; A.lArmZ = 1.8; A.rArmZ = -1.8; }
  if (runShow.on && runShow.phase==='pose' && runShow.style==='classic'){ A.rArmZ = -2.2; A.lArm = 0.15; A.headTilt = 0.1; }

  // áp dụng góc mượt
  const k = 1 - Math.pow(0.0001, dt);
  legL.rotation.x += (A.lLeg - legL.rotation.x)*k;
  legR.rotation.x += (A.rLeg - legR.rotation.x)*k;
  armL.rotation.x += (A.lArm - armL.rotation.x)*k;
  armR.rotation.x += (A.rArm - armR.rotation.x)*k;
  armL.rotation.z += (A.lArmZ - armL.rotation.z)*k;
  armR.rotation.z += (A.rArmZ - armR.rotation.z)*k;
  headG.rotation.z += (A.headTilt - headG.rotation.z)*k;
  body.position.y += (A.bodyY - body.position.y)*k;

  // nhịp thở
  body.scale.y = 1 + Math.sin(t*2.2)*0.006;

  // camera theo nhân vật nhẹ + controls
  const follow = char.position;
  controls.target.lerp(new THREE.Vector3(follow.x, follow.y+1.0, follow.z), 1-Math.pow(0.01, dt));
  controls.update();

  // spotlight đuổi theo ngườ mẫu
  spotTarget.position.set(char.position.x, 0.5, char.position.z);
  if (runShow.on) spotTarget.position.set(char.position.x, 0.5, char.position.z);

  // kim tuyến bay
  [spark1, spark2, burst].forEach(p=>{
    if (!p) return;
    const pos = p.geometry.attributes.position;
    for (let i=0;i<pos.count;i++){
      let y = pos.getY(i) + dt*0.5;
      if (y > 4) y = 0;
      pos.setY(i, y);
    }
    pos.needsUpdate = true;
    p.rotation.y += dt*0.15;
  });
  // fairy wings đập nhẹ
  if (acc.fairywings.visible) acc.fairywings.rotation.y = Math.sin(t*6)*0.15;

  renderer.render(scene, camera);
}

// ---------- chụp & tải ảnh ----------
function downloadPhoto(){
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'fashion-design-'+Date.now()+'.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
  toast('📷 Đã lưu ảnh!');
}

// ---------- resize ----------
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- khởi tạo ----------
const snapshotDefault = snapshot();
applyState(snapshotDefault);
renderTab('dress');
char.position.set(0, 0, 2.5);
animate();
setTimeout(()=>{
  const l=document.getElementById('loading');
  l.style.opacity='0'; setTimeout(()=>l.remove(), 650);
}, 900);
toast('🎀 Chào mừng bé đến Fashion Designer 3D!');
</script>
