<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Đang chuyển hướng đến Barbee Fashion... 💖</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fecfef);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #4a2c3a;
        overflow: hidden;
    }
    .redirect-card {
        background: rgba(255, 255, 255, 0.9);
        padding: 40px 60px;
        border-radius: 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        text-align: center;
        backdrop-filter: blur(10px);
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        z-index: 10;
    }
    @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    h1 {
        font-size: 24px;
        margin-bottom: 10px;
        background: linear-gradient(45deg, #f06292, #f48fb1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(240, 98, 146, 0.3);
        border-top-color: #f06292;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    p {
        font-size: 14px;
        color: #888;
        margin-bottom: 25px;
    }

    .manual-btn {
        display: inline-block;
        background: linear-gradient(45deg, #f06292, #f48fb1);
        color: #fff;
        text-decoration: none;
        padding: 15px 30px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 5px 15px rgba(240, 98, 146, 0.4);
        transition: 0.3s;
    }
    .manual-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(240, 98, 146, 0.6);
    }

    /* Hiệu ứng trái tim bay */
    .heart {
        position: absolute;
        bottom: -20px;
        font-size: 24px;
        color: #ff6b9d;
        animation: floatUp 4s ease-in infinite;
        opacity: 0;
    }
    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }
</style>
</head>
<body>

    <!-- Hiệu ứng trái tim -->
    <div class="heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="heart" style="left: 30%; animation-delay: 1s;">💖</div>
    <div class="heart" style="left: 70%; animation-delay: 0.5s;">💕</div>
    <div class="heart" style="left: 90%; animation-delay: 1.5s;">💗</div>

    <div class="redirect-card">
        <h1>✨ Đang mở Barbee Fashion ✨</h1>
        <p>Bạn sẽ được chuyển hướng đến trang chủ Plix.gg sau giây lát...</p>

        <div class="spinner"></div>

        <a href="https://plix.gg/vi/games/barbee-fashion-influencer" target="_blank" class="manual-btn" id="btn-game">
            🎮 Chơi ngay (Nếu không tự chuyển)
        </a>
    </div>

    <script>
        // Tự động chuyển hướng sau 1.5 giây
        setTimeout(function() {
            window.open('https://plix.gg/vi/games/barbee-fashion-influencer', '_blank');
        }, 1500);
    </script>
</body>
</html>
