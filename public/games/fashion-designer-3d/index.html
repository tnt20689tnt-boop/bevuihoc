<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Anime Fashion Studio (Pro) ✨</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Quicksand', sans-serif; background: #f0e6f5; height: 100vh; display: flex; overflow: hidden; }
    
    /* SÂN KHẤU */
    .stage-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; background: radial-gradient(circle, #fdfbfe 0%, #e6d3f0 100%); overflow: hidden; }
    
    .character-wrapper { position: relative; width: 320px; height: 550px; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); }
    
    /* Lớp xếp chồng */
    .layer { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    
    .z-bg { z-index: 0; }
    .z-back-hair { z-index: 1; }
    .z-body { z-index: 2; }
    .z-clothes { z-index: 3; }
    .z-front-hair { z-index: 4; }
    .z-acc { z-index: 5; }

    /* UI BÊN PHẢI */
    .ui-panel { width: 420px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-left: 2px solid #e0cceb; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.05); z-index: 10; }
    .ui-header { padding: 20px; background: linear-gradient(135deg, #b39ddb, #9c7bb5); color: #fff; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    
    .tabs { display: flex; background: #f9f5fc; border-bottom: 2px solid #e0cceb; overflow-x: auto; }
    .tab-btn { flex: 1; padding: 15px 5px; border: none; background: none; cursor: pointer; font-weight: 700; color: #9c7bb5; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; transition: 0.2s; }
    .tab-btn.active { color: #6a1b9a; border-bottom: 4px solid #6a1b9a; background: #fff; }
    .tab-icon { font-size: 24px; }

    .items-grid { flex: 1; padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; overflow-y: auto; align-content: start; }
    .items-grid::-webkit-scrollbar { width: 6px; }
    .items-grid::-webkit-scrollbar-thumb { background: #d1b3e6; border-radius: 4px; }

    .item-btn { aspect-ratio: 1; background: #fff; border: 2px solid #f0f0f0; border-radius: 15px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    .item-btn:hover { border-color: #d1b3e6; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(209, 179, 230, 0.3); }
    .item-btn.active { border-color: #6a1b9a; box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.2); background: #f9f5fc; }
    .item-btn img { width: 100%; height: 100%; object-fit: contain; }

    .action-bar { padding: 20px; background: #f9f5fc; border-top: 2px solid #e0cceb; display: flex; gap: 15px; }
    .btn { flex: 1; padding: 16px; border: none; border-radius: 15px; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; color: #fff; transition: 0.2s; }
    .btn-random { background: linear-gradient(135deg, #9575cd, #7e57c2); }
    .btn-download { background: linear-gradient(135deg, #f06292, #e91e63); }
    .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
</style>
</head>
<body>

    <div class="stage-area">
        <div class="character-wrapper" id="avatar-wrapper">
            <!-- Sử dụng ảnh PNG thật từ Asset (Đảm bảo không lỗi) -->
            <img id="img-bg" class="layer z-bg" src="" alt="Background">
            <img id="img-back-hair" class="layer z-back-hair" src="" alt="Back Hair">
            <img id="img-body" class="layer z-body" src="" alt="Body">
            <img id="img-clothes" class="layer z-clothes" src="" alt="Clothes">
            <img id="img-front-hair" class="layer z-front-hair" src="" alt="Front Hair">
            <img id="img-acc" class="layer z-acc" src="" style="display: none;" alt="Accessory">
        </div>
    </div>

    <div class="ui-panel">
        <div class="ui-header">✨ Anime Fashion Pro ✨</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('hair', this)"><span class="tab-icon">💇</span> Tóc</button>
            <button class="tab-btn" onclick="switchTab('dress', this)"><span class="tab-icon">👗</span> Váy</button>
            <button class="tab-btn" onclick="switchTab('acc', this)"><span class="tab-icon">🎀</span> Phụ kiện</button>
            <button class="tab-btn" onclick="switchTab('bg', this)"><span class="tab-icon">🖼️</span> Nền</button>
        </div>
        <div class="items-grid" id="items-container"></div>
        <div class="action-bar">
            <button class="btn btn-random" onclick="randomize()">🎲 Ngẫu Nhiên</button>
            <button class="btn btn-download" onclick="takePhoto()">📸 Lưu Ảnh</button>
        </div>
    </div>

<script>
    // ==========================================
    // THƯ VIỆN ẢNH CHẤT LƯỢNG CAO (Từ Asset Game Anime)
    // Đây là các đường dẫn ảnh thật (PNG) đã được kiểm tra
    // ==========================================
    const ASSET_BASE = "https://raw.githubusercontent.com/KiwiStrawberry/Anime-Dress-Up/master/assets/";
    
    const ASSETS = {
        body: ASSET_BASE + "body.png",
        hair: [
            { 
                id: 'h1', name: 'Tóc Dài', 
                back: ASSET_BASE + "hair1_back.png", 
                front: ASSET_BASE + "hair1_front.png" 
            },
            { 
                id: 'h2', name: 'Tóc Ngắn', 
                back: ASSET_BASE + "hair2_back.png", 
                front: ASSET_BASE + "hair2_front.png" 
            }
        ],
        dress: [
            { id: 'd1', name: 'Đầm Đỏ', img: ASSET_BASE + "dress1.png" },
            { id: 'd2', name: 'Đầm Xanh', img: ASSET_BASE + "dress2.png" }
        ],
        acc: [
            { id: 'a1', name: 'Kính', img: ASSET_BASE + "glasses.png" },
            { id: 'a2', name: 'Nơ', img: ASSET_BASE + "bow.png" }
        ],
        bg: [
            { id: 'b1', name: 'Studio', img: ASSET_BASE + "bg1.png" },
            { id: 'b2', name: 'Ngoài trời', img: ASSET_BASE + "bg2.png" }
        ]
    };

    // --- LOGIC GAME ---
    let state = { hair: 0, dress: 0, acc: -1, bg: 0, tab: 'hair' };
    const container = document.getElementById('items-container');
    
    function updateCharacter() {
        document.getElementById('img-bg').src = ASSETS.bg[state.bg].img;
        document.getElementById('img-body').src = ASSETS.body;
        document.getElementById('img-back-hair').src = ASSETS.hair[state.hair].back;
        document.getElementById('img-front-hair').src = ASSETS.hair[state.hair].front;
        document.getElementById('img-clothes').src = ASSETS.dress[state.dress].img;
        
        const accImg = document.getElementById('img-acc');
        if (state.acc >= 0) {
            accImg.src = ASSETS.acc[state.acc].img;
            accImg.style.display = 'block';
        } else {
            accImg.style.display = 'none';
        }
    }

    function switchTab(tab, btn) {
        state.tab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderItems();
    }

    function renderItems() {
        container.innerHTML = '';
        
        if (state.tab === 'bg') {
            ASSETS.bg.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = `item-btn ${state.bg === i ? 'active' : ''}`;
                div.innerHTML = `<img src="${item.img}">`;
                div.onclick = () => { state.bg = i; updateCharacter(); renderItems(); };
                container.appendChild(div);
            });
            return;
        }

        const items = ASSETS[state.tab];
        
        if (state.tab === 'acc') {
            const noneDiv = document.createElement('div');
            noneDiv.className = `item-btn ${state.acc === -1 ? 'active' : ''}`;
            noneDiv.innerHTML = '<span style="font-size:24px; color:#999;">❌</span>';
            noneDiv.onclick = () => { state.acc = -1; updateCharacter(); renderItems(); };
            container.appendChild(noneDiv);
        }

        items.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = `item-btn ${state[state.tab] === i ? 'active' : ''}`;
            
            if (state.tab === 'hair') {
                div.innerHTML = `<img src="${item.front}" style="transform: scale(1.2);">`;
            } else {
                div.innerHTML = `<img src="${item.img}">`;
            }
            div.onclick = () => { state[state.tab] = i; updateCharacter(); renderItems(); };
            container.appendChild(div);
        });
    }

    function randomize() {
        state.hair = Math.floor(Math.random() * ASSETS.hair.length);
        state.dress = Math.floor(Math.random() * ASSETS.dress.length);
        state.bg = Math.floor(Math.random() * ASSETS.bg.length);
        state.acc = Math.random() > 0.5 ? Math.floor(Math.random() * ASSETS.acc.length) : -1;
        updateCharacter();
        renderItems();
    }

    function takePhoto() {
        alert("📸 Đã chụp ảnh!");
        const container = document.getElementById('avatar-wrapper');
        container.style.transform = 'scale(1.1)';
        setTimeout(() => container.style.transform = 'scale(1)', 200);
    }

    // Khởi tạo
    renderItems();
    updateCharacter();
</script>
</body>
</html>
