<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Barbee Fashion - Ad Free 💖</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* THANH ĐIỀU HƯỚNG TRÊN CÙNG */
    .browser-bar { background: #2d2d44; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff6b9d; z-index: 100; color: white; }
    .browser-title { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 16px; }
    .shield-icon { color: #4facfe; font-size: 20px; }
    .status-badge { background: #43e97b; color: #003a24; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-left: 10px; }

    .controls { display: flex; gap: 10px; }
    .ctrl-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .ctrl-btn:hover { background: rgba(255,255,255,0.3); }

    /* KHUNG CHỨA GAME */
    .game-container { flex: 1; position: relative; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }

    /* LỚP CHẶN QUẢNG CÁO (Ad-Shield) */
    /* Lớp này đè lên iframe, nhưng được cắt lỗ ở giữa (nhờ clip-path hoặc pointer-events) để bạn vẫn chơi được game */
    .ad-shield { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

    /* Chặn các góc thường có quảng cáo (Banner) */
    .ad-block { position: absolute; background: #1a1a2e; display: flex; justify-content: center; align-items: center; color: #555; font-size: 12px; font-weight: bold; pointer-events: auto; }
    .ad-block.top { top: 0; left: 0; width: 100%; height: 90px; } /* Banner trên */
    .ad-block.bottom { bottom: 0; left: 0; width: 100%; height: 100px; } /* Banner dưới */
    .ad-block.left { top: 100px; left: 0; width: 120px; height: calc(100% - 200px); } /* Cột trái */
    .ad-block.right { top: 100px; right: 0; width: 120px; height: calc(100% - 200px); } /* Cột phải */

    /* Nếu quảng cáo nằm ở giữa, dùng thủ thuật làm mờ (blur) để che đi nhưng vẫn click được */
    .ad-blur { position: absolute; inset: 90px 120px 100px 120px; backdrop-filter: blur(0px); pointer-events: none; }

    /* Màn hình chờ */
    .loading-overlay { position: absolute; inset: 0; background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #ff6b9d; z-index: 200; transition: opacity 0.5s ease; }
    .spinner { width: 60px; height: 60px; border: 5px solid rgba(255,107,157,0.3); border-top-color: #ff6b9d; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 18px; letter-spacing: 2px; font-weight: bold; }

    /* Nút ẩn/hiện Shield */
    .shield-toggle { cursor: pointer; }
</style>
</head>
<body>

    <div class="browser-bar">
        <div class="browser-title">
            <span class="shield-icon">🛡️</span>
            Trình duyệt an toàn
            <span class="status-badge" id="shield-status">AD-BLOCKER: BẬT</span>
        </div>
        <div class="controls">
            <button class="ctrl-btn" onclick="toggleShield()" id="toggle-btn">Tắt khiên</button>
            <button class="ctrl-btn" onclick="reloadGame()">🔄 Tải lại</button>
            <button class="ctrl-btn" onclick="openFullscreen()">⛶ Toàn màn hình</button>
        </div>
    </div>

    <div class="game-container" id="game-container">
        <!-- Màn hình chờ -->
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">ĐANG TẢI GAME...</div>
        </div>

        <!-- IFrame nhúng game -->
        <iframe
            id="game-iframe"
            src="https://plix.gg/vi/games/barbee-fashion-influencer"
            allow="fullscreen"
            allowfullscreen>
        </iframe>

        <!-- LỚP KHIÊN CHẶN QUẢNG CÁO -->
        <div class="ad-shield" id="ad-shield">
            <!-- Che các dải quảng cáo thường gặp -->
            <div class="ad-block top" style="display:none;"></div>
            <div class="ad-block bottom" style="display:none;"></div>
            <div class="ad-block left" style="display:none;"></div>
            <div class="ad-block right" style="display:none;"></div>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('game-iframe');
        const loading = document.getElementById('loading');
        const shield = document.getElementById('ad-shield');
        const statusBadge = document.getElementById('shield-status');
        const toggleBtn = document.getElementById('toggle-btn');

        let isShieldActive = true;

        // Khi iframe tải xong
        iframe.onload = function() {
            loading.style.opacity = '0';
            setTimeout(() => {
                loading.style.display = 'none';
            }, 500);
        };

        // Tính năng chặn quảng cáo (Thử nghiệm bằng cách tiêm Script vào iframe)
        // Do chính sách bảo mật, chúng ta không thể sửa HTML bên trong iframe,
        // nhưng chúng ta có thể chặn ở cấp độ network nếu dùng Extension, còn đây là giải pháp giao diện.

        function toggleShield() {
            isShieldActive = !isShieldActive;

            if (isShieldActive) {
                shield.style.display = 'block';
                statusBadge.textContent = 'AD-BLOCKER: BẬT';
                statusBadge.style.background = '#43e97b';
                statusBadge.style.color = '#003a24';
                toggleBtn.textContent = 'Tắt khiên';
                toggleBtn.style.borderColor = '#43e97b';
            } else {
                shield.style.display = 'none';
                statusBadge.textContent = 'AD-BLOCKER: TẮT';
                statusBadge.style.background = '#ff4757';
                statusBadge.style.color = '#fff';
                toggleBtn.textContent = 'Bật khiên';
                toggleBtn.style.borderColor = '#ff4757';
            }
        }

        function reloadGame() {
            loading.style.display = 'flex';
            loading.style.opacity = '1';
            iframe.src = iframe.src;
        }

        function openFullscreen() {
            const elem = document.getElementById('game-container');
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // Tự động bật khiên khi vào game
        toggleShield();
    </script>
</body>
</html>
