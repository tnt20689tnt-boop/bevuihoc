<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Fashion Studio - No Ads ✨</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#ffeef2;height:100vh;overflow:hidden;display:flex;color:#4a2c3a}
.character-area{flex:1;min-width:0;position:relative;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#fce4ec,#f8bbd0);transition:background .5s;overflow:hidden}
.stage{position:relative;width:350px;height:600px;max-width:100%;display:flex;justify-content:center;align-items:flex-end;padding-bottom:20px}
.layer{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;height:100%;object-fit:contain;pointer-events:none;transition:opacity .1s}
.z-bg{z-index:1}.z-hair-back{z-index:2}.z-body{z-index:3}.z-shoes{z-index:4}.z-dress{z-index:5}.z-hair-front{z-index:6}.z-acc{z-index:7}
.ui-area{width:400px;max-width:48vw;background:#fff;border-left:4px solid #f48fb1;display:flex;flex-direction:column;box-shadow:-5px 0 25px #00000014;z-index:10}
.ui-header{padding:20px;background:#f48fb1;color:#fff;text-align:center;font-size:22px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 4px #0002}
.tabs{display:flex;border-bottom:2px solid #fce4ec;background:#fff9fb;overflow-x:auto}
.tab-btn{flex:1;min-width:58px;padding:15px 5px;border:0;background:none;cursor:pointer;font-weight:bold;color:#b08090;transition:.2s;font-size:13px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:5px}
.tab-btn:hover{background:#fce4ec;color:#f48fb1}.tab-btn.active{color:#e91e63;border-bottom:3px solid #e91e63;background:#fff}.tab-icon{font-size:22px}
.items-container{flex:1;min-height:0;padding:20px;overflow-y:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;align-content:start}
.items-container::-webkit-scrollbar{width:8px}.items-container::-webkit-scrollbar-thumb{background:#f48fb1;border-radius:4px}
.item-btn{aspect-ratio:1;border:2px solid #eee;border-radius:12px;background:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:.2s;position:relative;box-shadow:0 2px 5px #00000005;overflow:hidden}
.item-btn:hover{border-color:#f48fb1;transform:translateY(-3px);box-shadow:0 4px 10px #f48fb14d}.item-btn.active{border-color:#e91e63;background:#fce4ec;box-shadow:0 0 0 2px #e91e63 inset}
.item-btn img{width:80%;height:80%;object-fit:contain}
.action-area{padding:15px;background:#fff9fb;border-top:2px solid #fce4ec;display:flex;gap:10px}
.action-btn{flex:1;padding:15px;border:0;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer;transition:.2s;color:#fff;text-shadow:0 1px 2px #0003}
.action-btn.random{background:linear-gradient(45deg,#ba68c8,#ce93d8)}.action-btn:hover{filter:brightness(1.05);transform:translateY(-2px)}
@media(max-width:700px){body{flex-direction:column}.character-area{flex:1;min-height:0}.stage{height:100%;width:100%;padding:8px;align-items:center}.layer{height:100%;width:auto;max-width:100%;max-height:100%}.ui-area{width:100%;max-width:none;height:48vh;border-left:0;border-top:4px solid #f48fb1}.ui-header{padding:9px;font-size:18px}.tab-btn{padding:7px 3px;font-size:11px}.tab-icon{font-size:18px}.items-container{padding:10px;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.action-area{padding:8px}.action-btn{padding:10px;font-size:13px}}
</style>
</head>
<body>
<div class="character-area" id="character-area">
 <div class="stage">
  <img id="img-hair-back" class="layer z-hair-back" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M100,100 Q70,250 50,400 Q150,420 250,400 Q230,250 200,100 Z' fill='%23333'/></svg>" alt="Tóc sau">
  <img id="img-body" class="layer z-body" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><ellipse cx='150' cy='120' rx='45' ry='55' fill='%23ffd5c2'/><path d='M130,175 L170,175 L160,280 L140,280 Z' fill='%23ffd5c2'/><path d='M135,280 L135,460 Q135,470 145,470 L145,470 Q155,470 155,460 L155,280 Z' fill='%23ffd5c2'/><path d='M145,280 L145,460 Q145,470 155,470 L155,470 Q165,470 165,460 L165,280 Z' fill='%23ffd5c2'/><circle cx='125' cy='120' r='6' fill='%23333'/><circle cx='175' cy='120' r='6' fill='%23333'/></svg>" alt="Cơ thể">
  <img id="img-shoes" class="layer z-shoes" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M125,460 L125,480 L155,480 L155,460 Z' fill='%23e91e63'/><path d='M145,460 L145,480 L175,480 L175,460 Z' fill='%23e91e63'/></svg>" alt="Giày">
  <img id="img-dress" class="layer z-dress" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M125,180 L175,180 L185,300 L115,300 Z' fill='%23ff6b9d'/><path d='M115,300 L185,300 L220,420 Q150,450 80,420 Z' fill='%23ff6b9d'/></svg>" alt="Váy">
  <img id="img-hair-front" class="layer z-hair-front" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M105,120 Q105,50 150,50 Q195,50 195,120 Q195,140 150,140 Q105,140 105,120 Z' fill='%23333'/></svg>" alt="Tóc trước">
  <img id="img-acc" class="layer z-acc" src="" style="display:none" alt="Phụ kiện">
 </div>
</div>
<div class="ui-area">
 <div class="ui-header">✨ Fashion Studio ✨</div>
 <div class="tabs">
  <button class="tab-btn active" onclick="switchTab('hair',this)"><span class="tab-icon">💇</span>Tóc</button>
  <button class="tab-btn" onclick="switchTab('dress',this)"><span class="tab-icon">👗</span>Váy</button>
  <button class="tab-btn" onclick="switchTab('shoes',this)"><span class="tab-icon">👠</span>Giày</button>
  <button class="tab-btn" onclick="switchTab('acc',this)"><span class="tab-icon">🎀</span>Kính</button>
  <button class="tab-btn" onclick="switchTab('bg',this)"><span class="tab-icon">🖼️</span>Nền</button>
 </div>
 <div class="items-container" id="items-container"></div>
 <div class="action-area"><button class="action-btn random" onclick="randomize()">🎲 Ngẫu Nhiên</button></div>
</div>
<script>
const DB={
hair:[
{id:'h1',back:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M100,100 Q70,250 50,400 Q150,420 250,400 Q230,250 200,100 Z' fill='%234a2c3a'/></svg>",front:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M105,120 Q105,50 150,50 Q195,50 195,120 Q195,140 150,140 Q105,140 105,120 Z' fill='%234a2c3a'/></svg>"},
{id:'h2',back:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M110,120 Q80,250 60,350 Q100,370 120,350 L130,200 L170,200 L180,350 Q200,370 240,350 Q220,250 190,120 Z' fill='%23f8b500'/></svg>",front:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M110,110 Q110,60 150,60 Q190,60 190,110 Q190,130 150,130 Q110,130 110,110 Z' fill='%23f8b500'/></svg>"},
{id:'h3',back:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M100,120 Q100,200 110,250 Q150,260 190,250 Q200,200 200,120 Z' fill='%23ff6b9d'/></svg>",front:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M110,110 Q110,50 150,50 Q190,50 190,110 Q190,130 150,130 Q110,130 110,110 Z' fill='%23ff6b9d'/></svg>"}
],
dress:[
{id:'d1',img:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M120,180 L180,180 L190,280 L110,280 Z' fill='%23e91e63'/><path d='M110,280 L190,280 L230,420 Q150,450 70,420 Z' fill='%23e91e63'/></svg>"},
{id:'d2',img:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M120,180 L180,180 L190,280 L110,280 Z' fill='%234facfe'/><path d='M110,280 L190,280 L210,350 L90,350 Z' fill='%234facfe'/></svg>"},
{id:'d3',img:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M125,180 L175,180 L185,280 L115,280 Z' fill='%23f8b500'/><path d='M115,280 L185,280 L200,450 Q150,460 100,450 Z' fill='%23f8b500'/></svg>"}
],
shoes:[
{id:'s1',img:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M125,460 L125,480 L155,480 L155,460 Z' fill='%23333'/><path d='M145,460 L145,480 L175,480 L175,460 Z' fill='%23333'/></svg>"},
{id:'s2',img:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M120,460 L120,485 L155,485 L155,460 Z' fill='%23fff'/><path d='M145,460 L145,485 L180,485 L180,460 Z' fill='%23fff'/></svg>"}
],
acc:[
{id:'a1',img:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><circle cx='130' cy='115' r='10' fill='none' stroke='%23333' stroke-width='3'/><circle cx='170' cy='115' r='10' fill='none' stroke='%23333' stroke-width='3'/><line x1='140' y1='115' x2='160' y2='115' stroke='%23333' stroke-width='3'/></svg>"},
{id:'a2',img:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 500'><path d='M120,70 L180,70 L190,120 L110,120 Z' fill='%23ff6b9d'/><path d='M130,70 L130,40 L170,40 L170,70 Z' fill='%23ff6b9d'/></svg>"}
],
bg:[
{id:'b1',color:'linear-gradient(135deg,#fce4ec,#f8bbd0)'},
{id:'b2',color:'linear-gradient(135deg,#e3f2fd,#90caf9)'},
{id:'b3',color:'linear-gradient(135deg,#e8f5e9,#a5d6a7)'},
{id:'b4',color:'linear-gradient(135deg,#f3e5f5,#ce93d8)'}
]};
let state={hair:0,dress:0,shoes:0,acc:-1,bg:0,tab:'hair'};
const container=document.getElementById('items-container'),elCharArea=document.getElementById('character-area');
function updateCharacter(){
document.getElementById('img-hair-back').src=DB.hair[state.hair].back;
document.getElementById('img-hair-front').src=DB.hair[state.hair].front;
document.getElementById('img-dress').src=DB.dress[state.dress].img;
document.getElementById('img-shoes').src=DB.shoes[state.shoes].img;
const accImg=document.getElementById('img-acc');
if(state.acc>=0){accImg.src=DB.acc[state.acc].img;accImg.style.display='block'}else{accImg.style.display='none'}
elCharArea.style.background=DB.bg[state.bg].color;
}
function switchTab(tabId,btn){state.tab=tabId;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderItems()}
function renderItems(){
container.innerHTML='';
const tab=state.tab;
if(tab==='bg'){
DB.bg.forEach((item,i)=>{const div=document.createElement('div');div.className='item-btn'+(state.bg===i?' active':'');div.style.background=item.color;div.onclick=()=>{state.bg=i;updateCharacter();renderItems()};container.appendChild(div)});
return;
}
const items=DB[tab];
if(tab==='acc'){
const noneDiv=document.createElement('div');noneDiv.className='item-btn'+(state.acc===-1?' active':'');noneDiv.innerHTML='<span style="font-size:20px">❌</span>';noneDiv.onclick=()=>{state.acc=-1;updateCharacter();renderItems()};container.appendChild(noneDiv);
}
items.forEach((item,i)=>{
const div=document.createElement('div');div.className='item-btn'+(state[tab]===i?' active':'');
if(tab==='hair'){div.innerHTML='<img src="'+item.front+'" style="object-fit:cover;border-radius:8px">'}else{div.innerHTML='<img src="'+item.img+'">'}
div.onclick=()=>{state[tab]=i;updateCharacter();renderItems()};container.appendChild(div);
});
}
function randomize(){
state.hair=Math.floor(Math.random()*DB.hair.length);
state.dress=Math.floor(Math.random()*DB.dress.length);
state.shoes=Math.floor(Math.random()*DB.shoes.length);
state.bg=Math.floor(Math.random()*DB.bg.length);
state.acc=Math.random()>.5?Math.floor(Math.random()*DB.acc.length):-1;
updateCharacter();renderItems();
}
renderItems();updateCharacter();
</script>
</body>
</html>
