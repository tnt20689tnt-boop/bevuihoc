<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Công Chúa Beauty & Fashion Studio 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #2e124d 0%, #110524 100%);
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .game-title {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(45deg, #ff9a9e, #fecfef, #f6d365);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 12px rgba(255, 154, 162, 0.4);
    }
    .top-actions {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .btn-action {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }
    .btn-action.primary {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      border: none;
    }

    /* Studio UI Panel */
    .studio-panel {
      position: absolute;
      right: 20px;
      top: 75px;
      bottom: 25px;
      width: 320px;
      background: rgba(25, 12, 45, 0.8);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 192, 203, 0.35);
      border-radius: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    @media (max-width: 768px) {
      .studio-panel {
        width: 100%;
        right: 0;
        bottom: 0;
        top: auto;
        height: 48vh;
        border-radius: 24px 24px 0 0;
      }
      .top-bar {
        top: 10px;
        left: 10px;
        right: 10px;
      }
      .game-title {
        font-size: 15px;
      }
    }

    .category-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      background: none;
      border: none;
      color: #dfd7ee;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #fff;
      background: rgba(255, 105, 180, 0.28);
      border-bottom: 3px solid #ff758c;
    }

    .items-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .section-title {
      font-size: 12px;
      color: #ffb8d2;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .item-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .item-card:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.03);
    }
    .item-card.active {
      border-color: #ff758c;
      background: rgba(255, 117, 140, 0.28);
      box-shadow: 0 0 10px rgba(255, 117, 140, 0.4);
    }
    .item-card span.icon {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .item-card span.label {
      font-size: 11px;
      color: #f1e9fa;
    }
    .color-ball {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .color-ball:hover, .color-ball.active {
      transform: scale(1.15);
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    /* View Controls */
    .view-controls {
      position: absolute;
      left: 20px;
      bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .cam-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .cam-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="webgl-canvas"></canvas>

    <div class="top-bar">
      <div class="game-title">👑 CÔNG CHÚA BEAUTY STUDIO 3D</div>
      <div class="top-actions">
        <button class="btn-action" id="btn-sound">🔊 Âm Thanh</button>
        <button class="btn-action primary" id="btn-snapshot">📸 Chụp Ảnh Lưu Về</button>
      </div>
    </div>

    <div class="view-controls">
      <button class="cam-btn" id="cam-face">🔍 Cận Cảnh Khuôn Mặt</button>
      <button class="cam-btn" id="cam-body">👗 Toàn Thân / Trang Phục</button>
      <button class="cam-btn" id="btn-rotate">🔄 Tự Động Xoay Bục</button>
    </div>

    <div class="studio-panel">
      <div class="category-tabs">
        <button class="tab-btn active" data-tab="makeup">💄 Trang Điểm</button>
        <button class="tab-btn" data-tab="dress">👗 Trang Phục</button>
        <button class="tab-btn" data-tab="hair">👑 Phụ Kiện</button>
        <button class="tab-btn" data-tab="scene">🏰 Cung Điện</button>
      </div>

      <div class="items-content" id="panel-content"></div>
    </div>
  </div>

  <script>
    // Audio synthesizer
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playChime() {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const notes = [587.33, 659.25, 783.99, 880.00, 1046.50];
        const f = notes[Math.floor(Math.random() * notes.length)];
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f * 1.5, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e){}
    }

    // Studio state
    const studioState = {
      lipColor: '#e84393',
      blushColor: '#ff7675',
      eyeShadowColor: '#c77dff',
      gemDecor: true,
      dressTheme: 'pink',
      showWings: true,
      showTiara: true,
      roomTheme: 'palace',
      autoRotate: false
    };

    // Three.js Scene Setup
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a082b, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.25, 3.6);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.02;
    controls.minDistance = 1.0;
    controls.maxDistance = 5.5;
    controls.target.set(0, 1.15, 0);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.3);
    scene.add(ambientLight);

    const spotLight = new THREE.SpotLight(0xffd1eb, 2.8, 12, Math.PI / 4, 0.3);
    spotLight.position.set(0, 4.5, 3.2);
    spotLight.castShadow = true;
    scene.add(spotLight);

    const backGlow = new THREE.PointLight(0xb197fc, 2.0, 8);
    backGlow.position.set(0, 1.6, -1.2);
    scene.add(backGlow);

    // Environment: Royal Pedestal & Mirror
    const stageGroup = new THREE.Group();
    scene.add(stageGroup);

    const floorGeo = new THREE.CylinderGeometry(3.8, 3.8, 0.15, 32);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x220e3d, roughness: 0.25, metalness: 0.6 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -0.08;
    floor.receiveShadow = true;
    stageGroup.add(floor);

    const ringGeo = new THREE.TorusGeometry(1.8, 0.05, 16, 64);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.85, roughness: 0.15 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.01;
    stageGroup.add(ring);

    // Royal Golden Mirror Frame behind
    const mirrorFrameGeo = new THREE.TorusGeometry(1.3, 0.07, 16, 48);
    const mirrorFrame = new THREE.Mesh(mirrorFrameGeo, ringMat);
    mirrorFrame.position.set(0, 1.45, -1.0);
    stageGroup.add(mirrorFrame);

    // Princess Dynamic Canvas (High-Res 1024x1024)
    const pCanvas = document.createElement('canvas');
    pCanvas.width = 1024;
    pCanvas.height = 1024;
    const pCtx = pCanvas.getContext('2d');
    const princessTexture = new THREE.CanvasTexture(pCanvas);
    princessTexture.anisotropy = 8;

    // Load High-Res Beautiful Anime Princess Reference Image
    const princessImg = new Image();
    princessImg.crossOrigin = 'anonymous';
    // Princess Anime concept art
    princessImg.src = 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1024&q=80';

    princessImg.onload = () => {
      drawPrincessLive();
    };
    // In case of load delay, initial draw
    drawPrincessLive();

    function drawPrincessLive() {
      pCtx.clearRect(0, 0, 1024, 1024);

      if (princessImg.complete && princessImg.naturalWidth > 0) {
        // Draw the high quality princess image
        pCtx.save();
        // Soft vignette circle mask
        pCtx.beginPath();
        pCtx.ellipse(512, 512, 450, 480, 0, 0, Math.PI * 2);
        pCtx.clip();
        pCtx.drawImage(princessImg, 0, 0, 1024, 1024);

        // Apply Real-time Live Makeup layers directly onto the face coordinates
        // 1. Eyeshadow
        pCtx.fillStyle = studioState.eyeShadowColor;
        pCtx.globalAlpha = 0.35;
        pCtx.beginPath();
        pCtx.ellipse(440, 420, 45, 22, -0.05, 0, Math.PI * 2);
        pCtx.ellipse(585, 420, 45, 22, 0.05, 0, Math.PI * 2);
        pCtx.fill();

        // 2. Blush
        pCtx.fillStyle = studioState.blushColor;
        pCtx.globalAlpha = 0.4;
        pCtx.beginPath();
        pCtx.ellipse(400, 480, 55, 30, -0.1, 0, Math.PI * 2);
        pCtx.ellipse(620, 480, 55, 30, 0.1, 0, Math.PI * 2);
        pCtx.fill();

        // 3. Lips
        pCtx.fillStyle = studioState.lipColor;
        pCtx.globalAlpha = 0.55;
        pCtx.beginPath();
        pCtx.ellipse(512, 555, 48, 20, 0, 0, Math.PI * 2);
        pCtx.fill();

        // Lip Gloss Sparkle
        pCtx.fillStyle = '#ffffff';
        pCtx.globalAlpha = 0.75;
        pCtx.beginPath();
        pCtx.ellipse(505, 550, 16, 5, -0.1, 0, Math.PI * 2);
        pCtx.fill();

        // 4. Diamond Gems & Face Decor
        if (studioState.gemDecor) {
          pCtx.globalAlpha = 1.0;
          pCtx.font = '28px sans-serif';
          pCtx.fillText('💎', 380, 450);
          pCtx.fillText('✨', 625, 450);
          pCtx.fillText('🌸', 500, 340);
        }

        pCtx.restore();
      }

      princessTexture.needsUpdate = true;
    }

    // Cutout Standee Mesh with Alpha map and soft glow
    const princessPlaneGeo = new THREE.PlaneGeometry(1.5, 2.0);
    const princessMat = new THREE.MeshStandardMaterial({
      map: princessTexture,
      transparent: true,
      roughness: 0.3,
      metalness: 0.1,
      side: THREE.DoubleSide
    });

    const princessGroup = new THREE.Group();
    const princessMesh = new THREE.Mesh(princessPlaneGeo, princessMat);
    princessMesh.position.set(0, 1.15, 0);
    princessMesh.castShadow = true;
    princessGroup.add(princessMesh);
    scene.add(princessGroup);

    // 3D Fairy Wings
    const wingGeo = new THREE.PlaneGeometry(1.1, 1.3);
    const wingMat = new THREE.MeshStandardMaterial({
      color: 0x99ddff,
      emissive: 0x3388bb,
      transparent: true,
      opacity: 0.65,
      side: THREE.DoubleSide
    });
    const leftWing = new THREE.Mesh(wingGeo, wingMat);
    leftWing.position.set(-0.65, 1.3, -0.1);
    leftWing.rotation.y = 0.35;
    const rightWing = new THREE.Mesh(wingGeo, wingMat);
    rightWing.position.set(0.65, 1.3, -0.1);
    rightWing.rotation.y = -0.35;
    const wingsGroup = new THREE.Group();
    wingsGroup.add(leftWing, rightWing);
    princessGroup.add(wingsGroup);

    // 3D Golden Tiara
    const tiaraGroup = new THREE.Group();
    const tiaraGeo = new THREE.ConeGeometry(0.06, 0.2, 5);
    const tiaraMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
    for (let i = -2; i <= 2; i++) {
      const g = new THREE.Mesh(tiaraGeo, tiaraMat);
      g.position.set(i * 0.08, 2.05 + Math.abs(i) * -0.02, 0.04);
      tiaraGroup.add(g);
    }
    princessGroup.add(tiaraGroup);

    // Golden Sparkles Dust
    const sparkleCount = 60;
    const sparkleGeo = new THREE.BufferGeometry();
    const coords = new Float32Array(sparkleCount * 3);
    for (let i = 0; i < sparkleCount * 3; i += 3) {
      coords[i] = (Math.random() - 0.5) * 3;
      coords[i+1] = Math.random() * 2.5;
      coords[i+2] = (Math.random() - 0.5) * 3;
    }
    sparkleGeo.setAttribute('position', new THREE.BufferAttribute(coords, 3));
    const sparkleMat = new THREE.PointsMaterial({ color: 0xffe600, size: 0.04, transparent: true, opacity: 0.8 });
    const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
    scene.add(sparkles);

    // Smooth Camera Transition
    function moveCamera(x, y, z, tx, ty, tz) {
      let t = 0;
      const sx = camera.position.x, sy = camera.position.y, sz = camera.position.z;
      const stx = controls.target.x, sty = controls.target.y, stz = controls.target.z;
      function step() {
        t += 0.05;
        camera.position.x = sx + (x - sx) * t;
        camera.position.y = sy + (y - sy) * t;
        camera.position.z = sz + (z - sz) * t;
        controls.target.x = stx + (tx - stx) * t;
        controls.target.y = sty + (ty - sty) * t;
        controls.target.z = stz + (tz - stz) * t;
        if (t < 1) requestAnimationFrame(step);
      }
      step();
    }

    document.getElementById('cam-face').onclick = () => {
      playChime();
      moveCamera(0, 1.45, 1.5, 0, 1.4, 0);
    };
    document.getElementById('cam-body').onclick = () => {
      playChime();
      moveCamera(0, 1.25, 3.6, 0, 1.15, 0);
    };
    document.getElementById('btn-rotate').onclick = () => {
      playChime();
      studioState.autoRotate = !studioState.autoRotate;
    };

    // UI Tab Navigation
    const panelContent = document.getElementById('panel-content');
    const tabs = document.querySelectorAll('.tab-btn');

    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderTab(tab.dataset.tab);
        playChime();
      };
    });

    function renderTab(type) {
      panelContent.innerHTML = '';
      if (type === 'makeup') {
        panelContent.innerHTML = `
          <div class="section-title">💋 Màu Son Môi (Lipstick)</div>
          <div class="color-grid">
            ${['#e84393', '#d63031', '#fd79a8', '#ff7675', '#a29bfe'].map(c => `
              <div class="color-ball ${studioState.lipColor === c ? 'active':''}" style="background:${c}" onclick="setLip('${c}')"></div>
            `).join('')}
          </div>

          <div class="section-title">🌸 Phấn Má Hồng (Blush)</div>
          <div class="color-grid">
            ${['#ff7675', '#fab1a0', '#fd79a8', '#e17055', '#ff9ff3'].map(c => `
              <div class="color-ball ${studioState.blushColor === c ? 'active':''}" style="background:${c}" onclick="setBlush('${c}')"></div>
            `).join('')}
          </div>

          <div class="section-title">✨ Phấn Mắt Lấp Lánh (Eyeshadow)</div>
          <div class="color-grid">
            ${['#c77dff', '#74b9ff', '#55efc4', '#ffeaa7', '#ff7675'].map(c => `
              <div class="color-ball ${studioState.eyeShadowColor === c ? 'active':''}" style="background:${c}" onclick="setEyeShadow('${c}')"></div>
            `).join('')}
          </div>

          <div class="section-title">💎 Trang Trí Khuôn Mặt</div>
          <div class="item-grid">
            <div class="item-card ${studioState.gemDecor ? 'active':''}" onclick="toggleGems()">
              <span class="icon">✨</span>
              <span class="label">Đá Quý & Hoa</span>
            </div>
          </div>
        `;
      } else if (type === 'dress') {
        panelContent.innerHTML = `
          <div class="section-title">👗 Váy Dạ Hội Hoàng Gia</div>
          <div class="item-grid">
            <div class="item-card ${studioState.dressTheme==='pink'?'active':''}" onclick="setDressTheme('pink', 0xffd1eb)">
              <span class="icon">🌸</span>
              <span class="label">Hồng Cổ Tích</span>
            </div>
            <div class="item-card ${studioState.dressTheme==='ice'?'active':''}" onclick="setDressTheme('ice', 0xbbf2f6)">
              <span class="icon">❄️</span>
              <span class="label">Băng Giá Elza</span>
            </div>
            <div class="item-card ${studioState.dressTheme==='gold'?'active':''}" onclick="setDressTheme('gold', 0xffeaa7)">
              <span class="icon">✨</span>
              <span class="label">Hoàng Gia Vàng</span>
            </div>
          </div>

          <div class="section-title">🧚 Cánh Tiên</div>
          <div class="item-grid">
            <div class="item-card ${studioState.showWings ? 'active':''}" onclick="toggleWings()">
              <span class="icon">🪽</span>
              <span class="label">Cánh Phát Sáng</span>
            </div>
          </div>
        `;
      } else if (type === 'hair') {
        panelContent.innerHTML = `
          <div class="section-title">👑 Vương Miện Hoàng Gia</div>
          <div class="item-grid">
            <div class="item-card ${studioState.showTiara ? 'active':''}" onclick="toggleTiara()">
              <span class="icon">👑</span>
              <span class="label">Vương Miện Vàng</span>
            </div>
          </div>
        `;
      } else if (type === 'scene') {
        panelContent.innerHTML = `
          <div class="section-title">🏰 Phông Nền Cung Điện</div>
          <div class="item-grid">
            <div class="item-card ${studioState.roomTheme==='palace'?'active':''}" onclick="setSceneTheme('palace', 0x220e3d, 0xffd1eb)">
              <span class="icon">🏰</span>
              <span class="label">Cung Điện</span>
            </div>
            <div class="item-card ${studioState.roomTheme==='garden'?'active':''}" onclick="setSceneTheme('garden', 0x112d18, 0xd4ffdb)">
              <span class="icon">🌺</span>
              <span class="label">Vườn Hoa</span>
            </div>
            <div class="item-card ${studioState.roomTheme==='ice'?'active':''}" onclick="setSceneTheme('ice', 0x0a1c3d, 0xdff9fb)">
              <span class="icon">❄️</span>
              <span class="label">Lâu Đài Tuyết</span>
            </div>
          </div>
        `;
      }
    }
    renderTab('makeup');

    // Controls Action
    window.setLip = (c) => { studioState.lipColor = c; drawPrincessLive(); renderTab('makeup'); playChime(); };
    window.setBlush = (c) => { studioState.blushColor = c; drawPrincessLive(); renderTab('makeup'); playChime(); };
    window.setEyeShadow = (c) => { studioState.eyeShadowColor = c; drawPrincessLive(); renderTab('makeup'); playChime(); };
    window.toggleGems = () => { studioState.gemDecor = !studioState.gemDecor; drawPrincessLive(); renderTab('makeup'); playChime(); };
    window.toggleWings = () => { studioState.showWings = !studioState.showWings; wingsGroup.visible = studioState.showWings; renderTab('dress'); playChime(); };
    window.toggleTiara = () => { studioState.showTiara = !studioState.showTiara; tiaraGroup.visible = studioState.showTiara; renderTab('hair'); playChime(); };
    window.setDressTheme = (theme, lightCol) => {
      studioState.dressTheme = theme;
      spotLight.color.setHex(lightCol);
      renderTab('dress');
      playChime();
    };
    window.setSceneTheme = (name, floorC, lightC) => {
      studioState.roomTheme = name;
      floorMat.color.setHex(floorC);
      spotLight.color.setHex(lightC);
      renderTab('scene');
      playChime();
    };

    // Snapshot download
    document.getElementById('btn-snapshot').onclick = () => {
      playChime();
      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'cong-chua-studio-3d.png';
      a.click();
    };

    // Sound toggle
    document.getElementById('btn-sound').onclick = () => {
      playChime();
    };

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Wing gentle flutter
      if (wingsGroup.visible) {
        leftWing.rotation.y = 0.35 + Math.sin(time * 4) * 0.12;
        rightWing.rotation.y = -0.35 - Math.sin(time * 4) * 0.12;
      }

      // Sparkles rotate
      sparkles.rotation.y = time * 0.05;

      // Gentle floating animation
      princessGroup.position.y = Math.sin(time * 2) * 0.02;

      // Auto rotation mode
      if (studioState.autoRotate) {
        princessGroup.rotation.y += 0.015;
      } else {
        princessGroup.rotation.y = 0;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
