<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang mở Barbee Fashion...</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fecfef);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #4a2c3a;
        overflow: hidden;
    }
    .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 50px;
        border-radius: 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        text-align: center;
        backdrop-filter: blur(10px);
        animation: popIn 0.5s ease-out;
    }
    @keyframes popIn {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    h1 {
        font-size: 24px;
        margin-bottom: 10px;
        color: #e91e63;
        font-weight: 800;
    }
    p {
        font-size: 15px;
        color: #777;
        margin-bottom: 25px;
    }
    .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(240, 98, 146, 0.2);
        border-top-color: #f06292;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
        background: linear-gradient(45deg, #f06292, #f48fb1);
        color: #fff;
        text-decoration: none;
        padding: 15px 35px;
        border-radius: 25px;
        font-weight: bold;
        font-size: 16px;
        display: inline-block;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(240, 98, 146, 0.4);
    }
    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(240, 98, 146, 0.6);
    }
</style>
</head>
<body>
    <div class="card">
        <h1>✨ Đang mở Barbee Fashion ✨</h1>
        <p>Hệ thống đang tự động chuyển hướng bạn đến game...</p>
        <div class="spinner"></div>
        <!-- Nút dự phòng nếu trình duyệt chặn tự động chuyển -->
        <a href="https://plix.gg/vi/games/barbee-fashion-influencer" class="btn">
            🎮 Click vào đây nếu không tự chuyển
        </a>
    </div>
    <script>
        // Chuyển trang sau một giây.
        // Việc điều hướng trong iframe vẫn có thể bị website đích từ chối.
        setTimeout(function() {
            window.location.href = "https://plix.gg/vi/games/barbee-fashion-influencer";
        }, 1000);
    </script>
</body>
</html>
